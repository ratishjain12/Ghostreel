<!doctype html>
<html lang="en" data-resolution="square">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #fdfae7;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="28"
      data-width="1080"
      data-height="1080"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="4"
        data-track-index="1"
      ></div>
      <div
        id="el-02-task-success"
        class="scene"
        data-composition-id="02-task-success"
        data-composition-src="compositions/frames/02-task-success.html"
        data-start="4"
        data-duration="4"
        data-track-index="1"
      ></div>
      <div
        id="el-03-tool-call-accuracy"
        class="scene"
        data-composition-id="03-tool-call-accuracy"
        data-composition-src="compositions/frames/03-tool-call-accuracy.html"
        data-start="8"
        data-duration="4"
        data-track-index="1"
      ></div>
      <div
        id="el-04-failure-recovery"
        class="scene"
        data-composition-id="04-failure-recovery"
        data-composition-src="compositions/frames/04-failure-recovery.html"
        data-start="12"
        data-duration="4"
        data-track-index="1"
      ></div>
      <div
        id="el-05-cost-per-run"
        class="scene"
        data-composition-id="05-cost-per-run"
        data-composition-src="compositions/frames/05-cost-per-run.html"
        data-start="16"
        data-duration="4"
        data-track-index="1"
      ></div>
      <div
        id="el-06-human-in-the-loop"
        class="scene"
        data-composition-id="06-human-in-the-loop"
        data-composition-src="compositions/frames/06-human-in-the-loop.html"
        data-start="20"
        data-duration="4"
        data-track-index="1"
      ></div>
      <div
        id="el-07-cta"
        class="scene"
        data-composition-id="07-cta"
        data-composition-src="compositions/frames/07-cta.html"
        data-start="24"
        data-duration="4"
        data-track-index="1"
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
