<!doctype html>
<html lang="en" data-resolution="square">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      body {
        font-family: "Inter", sans-serif;
      }
      code,
      pre,
      .monospace {
        font-family: "JetBrains Mono", monospace;
      }
      #root {
        background: #fdfae7;
      }
      .slide {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="42"
      data-width="1080"
      data-height="1080"
    >
      <div
        id="el-01-cover"
        class="slide"
        data-composition-id="01-cover"
        data-composition-src="compositions/frames/01-cover.html"
        data-start="0"
        data-duration="6"
        data-track-index="1"
      ></div>
      <div
        id="el-02-question-1"
        class="slide"
        data-composition-id="02-question-1"
        data-composition-src="compositions/frames/02-question-1.html"
        data-start="6"
        data-duration="6"
        data-track-index="1"
      ></div>
      <div
        id="el-03-question-2"
        class="slide"
        data-composition-id="03-question-2"
        data-composition-src="compositions/frames/03-question-2.html"
        data-start="12"
        data-duration="6"
        data-track-index="1"
      ></div>
      <div
        id="el-04-question-3"
        class="slide"
        data-composition-id="04-question-3"
        data-composition-src="compositions/frames/04-question-3.html"
        data-start="18"
        data-duration="6"
        data-track-index="1"
      ></div>
      <div
        id="el-05-question-4"
        class="slide"
        data-composition-id="05-question-4"
        data-composition-src="compositions/frames/05-question-4.html"
        data-start="24"
        data-duration="6"
        data-track-index="1"
      ></div>
      <div
        id="el-06-question-5"
        class="slide"
        data-composition-id="06-question-5"
        data-composition-src="compositions/frames/06-question-5.html"
        data-start="30"
        data-duration="6"
        data-track-index="1"
      ></div>
      <div
        id="el-07-closing"
        class="slide"
        data-composition-id="07-closing"
        data-composition-src="compositions/frames/07-closing.html"
        data-start="36"
        data-duration="6"
        data-track-index="1"
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
