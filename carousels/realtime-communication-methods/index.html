<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #fdfae7;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="42"
      data-width="1080"
      data-height="1080"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="6"
        data-track-index="1"
      ></div>

      <div
        id="el-02-polling"
        class="scene"
        data-composition-id="02-polling"
        data-composition-src="compositions/frames/02-polling.html"
        data-start="6"
        data-duration="6"
        data-track-index="1"
      ></div>

      <div
        id="el-03-long-polling"
        class="scene"
        data-composition-id="03-long-polling"
        data-composition-src="compositions/frames/03-long-polling.html"
        data-start="12"
        data-duration="6"
        data-track-index="1"
      ></div>

      <div
        id="el-04-websockets"
        class="scene"
        data-composition-id="04-websockets"
        data-composition-src="compositions/frames/04-websockets.html"
        data-start="18"
        data-duration="6"
        data-track-index="1"
      ></div>

      <div
        id="el-05-sse"
        class="scene"
        data-composition-id="05-sse"
        data-composition-src="compositions/frames/05-sse.html"
        data-start="24"
        data-duration="6"
        data-track-index="1"
      ></div>

      <div
        id="el-06-comparison"
        class="scene"
        data-composition-id="06-comparison"
        data-composition-src="compositions/frames/06-comparison.html"
        data-start="30"
        data-duration="6"
        data-track-index="1"
      ></div>

      <div
        id="el-07-cta"
        class="scene"
        data-composition-id="07-cta"
        data-composition-src="compositions/frames/07-cta.html"
        data-start="36"
        data-duration="6"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
