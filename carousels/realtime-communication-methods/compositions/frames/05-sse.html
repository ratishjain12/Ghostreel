<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Space Grotesk";
          font-weight: 500;
          font-style: normal;
          font-display: block;
          src: url("assets/fonts/Space-Grotesk-500.woff2") format("woff2");
        }
        @font-face {
          font-family: "Space Grotesk";
          font-weight: 600;
          font-style: normal;
          font-display: block;
          src: url("assets/fonts/Space-Grotesk-600.woff2") format("woff2");
        }
        @font-face {
          font-family: "Space Grotesk";
          font-weight: 700;
          font-style: normal;
          font-display: block;
          src: url("assets/fonts/Space-Grotesk-700.woff2") format("woff2");
        }
        @font-face {
          font-family: "Inter";
          font-weight: 400;
          font-style: normal;
          font-display: block;
          src: url("assets/fonts/Inter-400.woff2") format("woff2");
        }
        @font-face {
          font-family: "Inter";
          font-weight: 600;
          font-style: normal;
          font-display: block;
          src: url("assets/fonts/Inter-600.woff2") format("woff2");
        }

        #root {
          position: relative;
          width: 1080px;
          height: 1080px;
          overflow: hidden;
          container-type: size;
          font-family: "Inter", sans-serif;
        }

        .f05-bg {
          position: absolute;
          inset: 0;
          background: #fdfae7;
        }

        .f05-content {
          position: absolute;
          inset: 80px;
          display: flex;
          flex-direction: column;
        }

        .f05-header-row {
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 18px;
        }
        .f05-eyebrow {
          font-family: "Space Grotesk", sans-serif;
          font-weight: 600;
          font-size: 1.7cqw;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: #1e2bfa;
        }
        .f05-pill {
          font-family: "Space Grotesk", sans-serif;
          font-weight: 500;
          font-size: 1.35cqw;
          color: #1e2bfa;
          background: rgba(30, 43, 250, 0.08);
          border-radius: 100px;
          padding: 9px 22px;
        }
        .f05-h2 {
          font-family: "Space Grotesk", sans-serif;
          font-weight: 600;
          font-size: 4.6cqw;
          letter-spacing: -0.02em;
          line-height: 1.15;
          color: #111111;
          margin-bottom: 44px;
        }

        .f05-body {
          display: flex;
          gap: 44px;
          align-items: center;
          flex: 1;
        }
        .f05-left {
          width: 56%;
          display: flex;
          flex-direction: column;
        }
        .f05-mechanism {
          font-family: "Inter", sans-serif;
          font-weight: 400;
          font-size: 2.05cqw;
          line-height: 1.6;
          color: #6b6b6b;
          margin-bottom: 40px;
        }

        .f05-diagram {
          display: flex;
          align-items: center;
          gap: 14px;
        }
        .f05-node {
          font-family: "Space Grotesk", sans-serif;
          font-weight: 600;
          font-size: 1.45cqw;
          color: #111111;
          background: rgba(30, 43, 250, 0.04);
          border: 1.5px solid rgba(30, 43, 250, 0.2);
          border-radius: 12px;
          padding: 14px 20px;
          white-space: nowrap;
        }
        .f05-connector {
          position: relative;
          flex: 1;
          height: 24px;
          display: flex;
          align-items: center;
        }
        .f05-connector::before {
          content: "";
          position: absolute;
          left: 10px;
          right: 10px;
          top: 50%;
          height: 3px;
          margin-top: -1.5px;
          background: #1e2bfa;
        }
        .f05-arrow-right {
          position: absolute;
          right: 0;
          top: 50%;
          width: 0;
          height: 0;
          margin-top: -6px;
          border-top: 6px solid transparent;
          border-bottom: 6px solid transparent;
          border-left: 9px solid #1e2bfa;
        }
        .f05-blocked {
          position: absolute;
          left: 0;
          top: 50%;
          width: 3px;
          height: 14px;
          margin-top: -7px;
          background: #9a9a9a;
          transform: rotate(20deg);
        }

        .f05-right {
          width: 44%;
        }
        .f05-highlight {
          background: rgba(30, 43, 250, 0.08);
          border-left: 4px solid #1e2bfa;
          border-radius: 12px;
          padding: 28px 30px;
        }
        .f05-highlight-label {
          display: flex;
          align-items: center;
          gap: 8px;
          font-family: "Space Grotesk", sans-serif;
          font-weight: 600;
          font-size: 1.35cqw;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: #1e2bfa;
          margin-bottom: 12px;
        }
        .f05-highlight-icon {
          position: relative;
          width: 18px;
          height: 10px;
        }
        .f05-highlight-icon::before {
          content: "";
          position: absolute;
          left: 2px;
          right: 6px;
          top: 50%;
          height: 2px;
          margin-top: -1px;
          background: #1e2bfa;
        }
        .f05-highlight-icon::after {
          content: "";
          position: absolute;
          right: 0;
          top: 50%;
          width: 0;
          height: 0;
          margin-top: -4px;
          border-top: 4px solid transparent;
          border-bottom: 4px solid transparent;
          border-left: 6px solid #1e2bfa;
        }
        .f05-highlight-body {
          font-family: "Inter", sans-serif;
          font-weight: 400;
          font-size: 2.0cqw;
          line-height: 1.5;
          color: #111111;
        }

        .f05-chrome {
          position: absolute;
          left: 80px;
          right: 80px;
          bottom: 80px;
        }
        .f05-counter {
          font-family: "Space Grotesk", sans-serif;
          font-weight: 500;
          font-size: 1.35cqw;
          letter-spacing: 0.05em;
          color: #9a9a9a;
          margin-bottom: 10px;
        }
        .f05-progress-track {
          width: 100%;
          height: 3px;
          background: rgba(30, 43, 250, 0.15);
        }
        .f05-progress-fill {
          width: 71.4%;
          height: 100%;
          background: #1e2bfa;
        }
      </style>

      <div id="root" data-composition-id="05-sse" data-width="1080" data-height="1080">
        <div class="clip f05-bg" data-start="0" data-duration="6" data-track-index="0"></div>

        <div class="clip f05-content" data-start="0" data-duration="6" data-track-index="1">
          <div class="f05-header-row">
            <div class="f05-eyebrow">Method 4 of 4</div>
            <div class="f05-pill">SSE</div>
          </div>
          <div class="f05-h2">The server keeps talking</div>

          <div class="f05-body">
            <div class="f05-left">
              <div class="f05-mechanism">
                One long-lived HTTP connection. The server streams events; the
                browser auto-reconnects natively and plays cleanly with existing
                HTTP infra.
              </div>
              <div class="f05-diagram">
                <div class="f05-node">CLIENT</div>
                <div class="f05-connector">
                  <div class="f05-blocked"></div>
                  <div class="f05-arrow-right"></div>
                </div>
                <div class="f05-node">SERVER</div>
              </div>
            </div>
            <div class="f05-right">
              <div class="f05-highlight">
                <div class="f05-highlight-label">
                  <span class="f05-highlight-icon"></span>
                  Hides
                </div>
                <div class="f05-highlight-body">
                  One-way only: there's no client-to-server channel on the same
                  connection.
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="clip f05-chrome" data-start="0" data-duration="6" data-track-index="2">
          <div class="f05-counter">5 / 7</div>
          <div class="f05-progress-track">
            <div class="f05-progress-fill"></div>
          </div>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        window.__timelines["05-sse"] = gsap.timeline({ paused: true });
      </script>
    </template>
  </body>
</html>
