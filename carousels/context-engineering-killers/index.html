<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #fdfae7;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="24"
      data-width="1080"
      data-height="1080"
    >
      <div
        id="el-01-cover"
        class="scene"
        data-composition-id="01-cover"
        data-composition-src="compositions/frames/01-cover.html"
        data-start="0"
        data-duration="4"
        data-track-index="1"
      ></div>

      <div
        id="el-02-poisoning"
        class="scene"
        data-composition-id="02-poisoning"
        data-composition-src="compositions/frames/02-poisoning.html"
        data-start="4"
        data-duration="4"
        data-track-index="1"
      ></div>

      <div
        id="el-03-distraction"
        class="scene"
        data-composition-id="03-distraction"
        data-composition-src="compositions/frames/03-distraction.html"
        data-start="8"
        data-duration="4"
        data-track-index="1"
      ></div>

      <div
        id="el-04-confusion"
        class="scene"
        data-composition-id="04-confusion"
        data-composition-src="compositions/frames/04-confusion.html"
        data-start="12"
        data-duration="4"
        data-track-index="1"
      ></div>

      <div
        id="el-05-clash"
        class="scene"
        data-composition-id="05-clash"
        data-composition-src="compositions/frames/05-clash.html"
        data-start="16"
        data-duration="4"
        data-track-index="1"
      ></div>

      <div
        id="el-06-closing"
        class="scene"
        data-composition-id="06-closing"
        data-composition-src="compositions/frames/06-closing.html"
        data-start="20"
        data-duration="4"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
