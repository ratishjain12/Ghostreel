<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #fdfae7;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="18"
      data-width="1080"
      data-height="1080"
    >
      <div
        id="el-01-cover"
        class="scene"
        data-composition-id="01-cover"
        data-composition-src="compositions/frames/01-cover.html"
        data-start="0"
        data-duration="3"
        data-track-index="1"
      ></div>

      <div
        id="el-02-cache-aside"
        class="scene"
        data-composition-id="02-cache-aside"
        data-composition-src="compositions/frames/02-cache-aside.html"
        data-start="3"
        data-duration="3"
        data-track-index="1"
      ></div>

      <div
        id="el-03-write-through"
        class="scene"
        data-composition-id="03-write-through"
        data-composition-src="compositions/frames/03-write-through.html"
        data-start="6"
        data-duration="3"
        data-track-index="1"
      ></div>

      <div
        id="el-04-write-behind"
        class="scene"
        data-composition-id="04-write-behind"
        data-composition-src="compositions/frames/04-write-behind.html"
        data-start="9"
        data-duration="3"
        data-track-index="1"
      ></div>

      <div
        id="el-05-risk-comparison"
        class="scene"
        data-composition-id="05-risk-comparison"
        data-composition-src="compositions/frames/05-risk-comparison.html"
        data-start="12"
        data-duration="3"
        data-track-index="1"
      ></div>

      <div
        id="el-06-cta"
        class="scene"
        data-composition-id="06-cta"
        data-composition-src="compositions/frames/06-cta.html"
        data-start="15"
        data-duration="3"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
