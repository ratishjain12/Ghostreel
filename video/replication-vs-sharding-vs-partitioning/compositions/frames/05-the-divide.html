  <div id="root" data-composition-id="05-the-divide" data-width="1080" data-height="1920" data-duration="9.131">

      <svg class="fr05-band-svg" id="fr05-top-outline" style="top:160px;" width="950" height="590" viewBox="0 0 950 590">

  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script>
    (function () {
      const root = document.querySelector('[data-composition-id="05-the-divide"]');
      const tl = gsap.timeline({ paused: true });

      const topRect = root.querySelector('#fr05-top-outline-rect');
      const bottomRect = root.querySelector('#fr05-bottom-outline-rect');
      const topPerimeter = 2 * (948 + 588);
      const bottomPerimeter = 2 * (948 + 643);
      gsap.set(topRect, { attr: { 'stroke-dasharray': topPerimeter, 'stroke-dashoffset': topPerimeter } });
      gsap.set(bottomRect, { attr: { 'stroke-dasharray': bottomPerimeter, 'stroke-dashoffset': bottomPerimeter } });

      // ---- background grid ----
      tl.fromTo(root.querySelector('.fr05-bg'), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: 'power1.out' }, 0);

      // ---- Scene 1 (0.0-1.01s): top band frame-outlines itself, empty ----
      tl.to(topRect, { attr: { 'stroke-dashoffset': 0 }, duration: 0.6, ease: 'power2.inOut' }, 0.05);
      tl.fromTo(root.querySelector('#fr05-label-top'), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power2.out' }, 0.55);

      // ---- Scene 2 (1.01-3.79s): top band fills ----
      const serverBox = root.querySelector('#fr05-server-box');
      tl.fromTo(serverBox, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.35, ease: 'power3.out' }, 1.05);

      // deterministic flicker to hollow/danger state
      tl.to(serverBox, { borderColor: 'rgba(255,92,122,0.9)', backgroundColor: 'rgba(255,92,122,0.06)', duration: 0.08 }, 1.5);
      tl.to(serverBox, { borderColor: 'rgba(137,146,161,0.4)', backgroundColor: '#12161C', duration: 0.08 }, 1.6);
      tl.to(serverBox, { borderColor: 'rgba(255,92,122,0.9)', backgroundColor: 'rgba(255,92,122,0.06)', duration: 0.08 }, 1.72);
      tl.to(serverBox, { borderColor: 'rgba(137,146,161,0.4)', backgroundColor: '#12161C', duration: 0.08 }, 1.82);
      tl.to(serverBox, { borderColor: '#FF5C7A', backgroundColor: 'transparent', duration: 0.14 }, 1.95);
      tl.fromTo(root.querySelector('#fr05-status-text'), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: 'power2.out' }, 2.05);

      tl.fromTo(root.querySelector('#fr05-reads-label'), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' }, 1.65);
      for (let i = 0; i < 5; i++) {
        tl.fromTo(
          root.querySelector('#fr05-dot-' + i),
          { opacity: 0, scale: 0 },
          { opacity: 1, scale: 1, duration: 0.3, ease: 'power3.out' },
          1.75 + i * 0.13,
        );
      }

      tl.fromTo(root.querySelector('#fr05-glow-replication'), { opacity: 0, scale: 0.85 }, { opacity: 0.3, scale: 1, duration: 0.3, ease: 'power2.out' }, 2.7);
      tl.fromTo(root.querySelector('#fr05-tag-replication'), { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.18, ease: 'power3.out' }, 2.7);

      // ---- Scene 3 (3.79-4.54s): divider self-draws ----
      tl.fromTo(root.querySelector('#fr05-divider'), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: 'power2.inOut' }, 3.85);
      tl.to(bottomRect, { attr: { 'stroke-dashoffset': 0 }, duration: 0.35, ease: 'power2.inOut' }, 4.15);
      tl.fromTo(root.querySelector('#fr05-label-bottom'), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' }, 4.3);

      // ---- Scene 4 (4.54-9.131s): bottom band fills, data strains and overflows ----
      const dataBox = root.querySelector('#fr05-data-box');
      tl.fromTo(dataBox, { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.4, ease: 'power3.out' }, 4.6);

      // bounded strain pulse, no bounce, settles/fades before the hold
      const strainPhase = { p: 0 };
      const STRAIN_START = 5.2;
      const STRAIN_DUR = 3.0;
      const STRAIN_CYCLES = 5;
      tl.to(
        strainPhase,
        {
          p: Math.PI * 2 * STRAIN_CYCLES,
          duration: STRAIN_DUR,
          ease: 'none',
          onUpdate: () => {
            const t = strainPhase.p / (Math.PI * 2 * STRAIN_CYCLES);
            const env = t < 0.8 ? 1 : (1 - t) / 0.2;
            const s = Math.sin(strainPhase.p) * 0.012 * env;
            dataBox.style.transform = 'scale(' + (1 + s) + ')';
          },
        },
        STRAIN_START,
      );

      tl.fromTo(root.querySelector('#fr05-glow-dual'), { opacity: 0, scale: 0.85 }, { opacity: 0.28, scale: 1, duration: 0.4, ease: 'power2.out' }, 5.9);
      tl.fromTo(root.querySelector('#fr05-tag-dual'), { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.4, ease: 'power3.out' }, 5.9);

      const marks = ['#fr05-mark-top', '#fr05-mark-right', '#fr05-mark-bottom', '#fr05-mark-left'];
      marks.forEach((sel, i) => {
        tl.fromTo(
          root.querySelector(sel),
          { opacity: 0, scale: 0 },
          { opacity: 1, scale: 1, duration: 0.22, ease: 'power3.out' },
          7.4 + i * 0.15,
        );
      });

      window.__timelines = window.__timelines || {};
      window.__timelines['05-the-divide'] = tl;
    })();
  </script>
