    (function () {
      const root = document.querySelector('[data-composition-id="08-the-ask"]');

      const kickerTextEl = root.querySelector('#ask-kicker-text');
      const kickerCursorEl = root.querySelector('#ask-kicker-cursor');
      const glowEl = root.querySelector('#ask-glow');
      const sublineTextEl = root.querySelector('#ask-subline-text');
      const sublineCursorEl = root.querySelector('#ask-subline-cursor');

      const KICKER_FULL = 'COMMENT';
      const SUBLINE_FULL = '→ full breakdown in the comments';

      const tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0-0.9s): "COMMENT" types on, smooth character slice.
      const kickerLen = { v: 0 };
      tl.to(
        kickerLen,
        {
          v: KICKER_FULL.length,
          duration: 0.55,
          ease: 'power1.inOut',
          onUpdate: () => {
            kickerTextEl.textContent = KICKER_FULL.substring(0, Math.floor(kickerLen.v));
          },
        },
        0
      );

      // Kicker cursor: finite blink for the exact typing + settle window, then hides.
      const kickerBlink = { p: 0 };
      tl.to(
        kickerBlink,
        {
          p: Math.PI * 2 * 1.6,
          duration: 0.9,
          ease: 'none',
          onUpdate: () => {
            kickerCursorEl.style.opacity = Math.sin(kickerBlink.p) > 0 ? '1' : '0';
          },
        },
        0
      );
      tl.set(kickerCursorEl, { opacity: 0 }, 0.9);

      // Scene 2 (0.9-2.04s): "GUIDE" hard-cuts in at full weight, amber, quote-marked.
      tl.set('.ask-guide', { opacity: 1 }, 0.9);

      // The kicker settles to a quieter, supporting brightness once GUIDE lands.
      tl.to(kickerTextEl.parentElement, { opacity: 0.55, duration: 0.3, ease: 'power2.out' }, 0.9);

      // Ambient bloom behind GUIDE — un-triggered, blooms in right on the cut (bloom-and-hold).
      tl.fromTo(
        glowEl,
        { opacity: 0, scale: 0.88 },
        { opacity: 0.3, scale: 1, duration: 0.5, ease: 'power2.out' },
        0.9
      );

      // Scene 3 (2.04-2.9s): mono sub-line types on beneath, then holds fully still to the end.
      const sublineLen = { v: 0 };
      tl.to(
        sublineLen,
        {
          v: SUBLINE_FULL.length,
          duration: 0.75,
          ease: 'power1.inOut',
          onUpdate: () => {
            sublineTextEl.textContent = SUBLINE_FULL.substring(0, Math.floor(sublineLen.v));
          },
        },
        2.04
      );

      const sublineBlink = { p: 0 };

        sublineBlink,

          p: Math.PI * 2 * 1.3,
          duration: 0.75,
          ease: 'none',
          onUpdate: () => {
