    (function () {
      var root = document.querySelector('[data-composition-id="03-partitioning"]');

      var box = root.querySelector('#p03-box');
      var crack1 = root.querySelector('#p03-crack-1');
      var crack2 = root.querySelector('#p03-crack-2');

      var stampEl = root.querySelector('#p03-stamp');
      var countB = root.querySelector('#p03-count-b');

      var stampText = 'DIVIDES, NEVER COPIES';
      stampEl.innerHTML = '';
      var chars = [];
      for (var i = 0; i < stampText.length; i++) {
        var ch = document.createElement('span');
        ch.className = 'p03-ch';
        ch.textContent = stampText[i] === ' ' ? ' ' : stampText[i];
        stampEl.appendChild(ch);
        chars.push(ch);
      }

      var CRACK_LEN = 204;
      gsap.set([crack1, crack2], { attr: { 'stroke-dasharray': CRACK_LEN, 'stroke-dashoffset': CRACK_LEN } });
      gsap.set([tile1, tile2, tile3], { opacity: 0, scale: 0.85, x: 0 });
      gsap.set([label2, label3], { opacity: 0 });
      gsap.set([fill1, fill2, fill3], { height: 0 });
      gsap.set(countB, { opacity: 0, x: -6 });

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines['03-partitioning'] = tl;

      // Scene 1 (0.0-1.41s) — single teal DATA node, hero visible by 0.45s

      // Scene 2 (1.41-4.87s) — box cracks along two internal teal hairlines

      tl.to(crack2, { attr: { 'stroke-dashoffset': 0 }, duration: 1.3, ease: 'power1.inOut' }, 2.95);

      // Scene 3 (4.87-8.29s) — crossfade to 3 tiles, per-word staggered reveal, then slide apart

      tl.to(tile1, { opacity: 1, scale: 1, duration: 0.5, ease: 'back.out(1.6)' }, 4.9);
      tl.to(fill1, { height: 140, duration: 0.5, ease: 'power2.out' }, 4.9);

      tl.to(tile2, { opacity: 1, scale: 1, duration: 0.5, ease: 'back.out(1.6)' }, 5.85);

      tl.to(label2, { opacity: 1, duration: 0.3, ease: 'power1.out' }, 6.0);

      tl.to(tile3, { opacity: 1, scale: 1, duration: 0.5, ease: 'back.out(1.6)' }, 7.0);
      tl.to(fill3, { height: 95, duration: 0.5, ease: 'power2.out' }, 7.0);
      tl.to(label3, { opacity: 1, duration: 0.3, ease: 'power1.out' }, 7.15);

      tl.to(tile1, { x: -16, duration: 0.45, ease: 'power2.out' }, 7.8);
      tl.to(tile3, { x: 16, duration: 0.45, ease: 'power2.out' }, 7.8);

      // Scene 4 (8.29-10.72s) — fill-strips settle to an equal, modest height
