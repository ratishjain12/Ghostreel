  <script>
    (function () {
      const root = document.querySelector('[data-composition-id="02-replication"]');
      const q = (sel) => root.querySelector(sel);

      const bg = q('.rep-bg');
      const hub = q('#rep-hub');
      const left = q('#rep-left');
      const leftLabel = left.querySelector('.rep-tag');
      const right = q('#rep-right');
      const rightLabel = right.querySelector('.rep-tag');
      const edgeLeft = q('#rep-edge-left');
      const edgeRight = q('#rep-edge-right');
      const availLetters = root.querySelectorAll('.rep-avail-letter');
      const dots = [q('#rep-dot-1'), q('#rep-dot-2'), q('#rep-dot-3'), q('#rep-dot-4')];

      gsap.set(bg, { opacity: 0 });
      gsap.set(availLetters, { opacity: 0, y: 8 });

      const tl = gsap.timeline({ paused: true });

      // Scene 1 (0 - 1.24s): void stage, single DATA node settles in.
      tl.fromTo(bg, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: 'none' }, 0);
      tl.fromTo(hub, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.35, ease: 'power2.out' }, 0.02);

      // Scene 2 (1.24 - 2.88s): edges self-draw to two empty node-boxes, then hard-cut fill to DATA.
      tl.fromTo(left, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.16, ease: 'power1.out' }, 1.24);
      tl.fromTo(right, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.16, ease: 'power1.out' }, 1.24);
      tl.fromTo(edgeLeft, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 1.0, ease: 'power1.inOut' }, 1.3);
      tl.fromTo(edgeRight, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 1.0, ease: 'power1.inOut' }, 1.3);

      tl.to(left, { backgroundColor: '#12161C', borderColor: '#FF9F45', duration: 0.12, ease: 'none' }, 2.45);
      tl.to(right, { backgroundColor: '#12161C', borderColor: '#FF9F45', duration: 0.12, ease: 'none' }, 2.45);
      tl.set(leftLabel, { opacity: 1 }, 2.5);
      tl.set(rightLabel, { opacity: 1 }, 2.5);
      tl.fromTo([left, right], { scale: 1 }, { scale: 1.05, duration: 0.1, ease: 'power1.out' }, 2.5);
      tl.to([left, right], { scale: 1, duration: 0.15, ease: 'power1.in' }, 2.6);

      // Scene 3 (2.88 - 5.2s): a single synchronized pulse across all three nodes.
      tl.to([hub, left, right], { scale: 1.06, duration: 0.18, ease: 'power2.out' }, 3.6);
      tl.to([hub, left, right], { scale: 1, duration: 0.22, ease: 'power2.in' }, 3.78);

      // Scene 4 (5.2 - 8.46s): AVAILABILITY types on; left node fails.
      tl.to(availLetters, { opacity: 1, y: 0, duration: 0.22, ease: 'power1.out', stagger: 0.06 }, 5.3);

      tl.to(left, { borderColor: '#FF5C7A', duration: 0.1, ease: 'none' }, 7.0);
      tl.to(left, { borderColor: 'rgba(137,146,161,0.4)', duration: 0.1, ease: 'none' }, 7.1);
      tl.to(left, { borderColor: '#FF5C7A', duration: 0.1, ease: 'none' }, 7.2);
      tl.to(left, { borderColor: 'rgba(74,82,94,0.7)', duration: 0.1, ease: 'none' }, 7.3);
      tl.to(left, { backgroundColor: 'transparent', duration: 0.45, ease: 'power1.inOut' }, 7.4);
      tl.to(leftLabel, { opacity: 0.3, duration: 0.45, ease: 'power1.inOut' }, 7.4);
      tl.to(edgeLeft, { strokeOpacity: 0.25, duration: 0.4, ease: 'power1.inOut' }, 7.85);

      // Scene 5 (8.46 - 12.117s): survivors connect, reads fan out onto the remaining nodes.
      tl.to(edgeRight, { strokeWidth: 5, duration: 0.25, ease: 'power1.out' }, 8.46);
      tl.to(edgeRight, { strokeWidth: 3, duration: 0.25, ease: 'power1.in' }, 8.71);

      const dotDeltaY = [32, 32, 52, 52];
      dots.forEach((dot, i) => {
        const start = 9.0 + i * 0.3;
        tl.fromTo(dot, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: 'none' }, start);
        tl.to(dot, { y: dotDeltaY[i], duration: 0.7, ease: 'power2.inOut' }, start);
      });

      tl.to({}, { duration: 0.001 }, 12.117);

      window.__timelines = window.__timelines || {};
      window.__timelines['02-replication'] = tl;
      tl.seek(0);
    })();
  </script>
