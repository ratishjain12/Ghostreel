      const edgePath = root.querySelector('#f02-edge-path');
      const edgeLen = edgePath.getTotalLength();
      edgePath.style.strokeDasharray = String(edgeLen);
      edgePath.style.strokeDashoffset = String(edgeLen);

      const tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0-4.26s) — CONTEXT WINDOW box spring-pop entrance, restrained (no overshoot).

        root.querySelector('.f02-cw-box'),
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: 'power3.out' },
        0.05,
      );
      tl.fromTo(
        root.querySelector('#f02-cw-label'),
        { opacity: 0 },
        { opacity: 0.55, duration: 0.45, ease: 'power3.out' },
        0.05,
      );
      tl.fromTo(
        root.querySelector('#f02-budget-label'),
        { opacity: 0 },
        { opacity: 1, duration: 0.45, ease: 'power3.out' },
        0.05,

        root.querySelector('.f02-prompt-box'),
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: 'power3.out' },

        root.querySelector('#f02-bar-fill'),
        { width: '62%', duration: 0.5, ease: 'power2.out' },

        root.querySelector('#f02-cw-label'),
        { opacity: 1, duration: 0.4, ease: 'power1.out' },

      window.__timelines = window.__timelines || {};
