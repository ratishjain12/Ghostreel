  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="03-memory"]');
      if (!root) return;

      var forkEdges = [0, 1, 2, 3, 4].map(function (i) { return root.querySelector('#mem03-fork-' + i); });
      var contEdge = root.querySelector('#mem03-cont');
      var fragEls = [0, 1, 2, 3, 4].map(function (i) { return root.querySelector('#mem03-frag-' + i); });
      var memEl = root.querySelector('#mem03-mem');
      var memLabel = root.querySelector('#mem03-mem-label');
      var memRole = root.querySelector('#mem03-mem-role');
      var layer2 = root.querySelector('#mem03-layer2');
      var barTeal = root.querySelector('#mem03-bar-teal');
      var counterWrap = root.querySelector('#mem03-counter');
      var counterBadge = root.querySelector('#mem03-counter-badge');

      // svg-path-draw setup: measure real geometry, never guess.
      forkEdges.concat([contEdge]).forEach(function (p) {
        var len = p.getTotalLength();
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
      });

      var tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines['03-memory'] = tl;

      var DIM_BORDER = 'rgba(137, 146, 161, 0.4)';
      var FRAG_BORDER_LIT = 'rgba(77, 232, 194, 0.7)';
      var FRAG_TAG_LIT = '#4DE8C2';
      var FRAG_TAG_DIM = '#8992A1';
      var FADED_STROKE = '#4A525E';

      // Scene 1 (0.0-3.42s): carried-over CONTEXT WINDOW box already static; MEMORY node spring-pops in, pinned.
      tl.fromTo(memEl, { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.42, ease: 'back.out(1.6)' }, 0.16);
      tl.fromTo(memLabel, { opacity: 0 }, { opacity: 1, duration: 0.22, ease: 'power2.out' }, 0.5);
      tl.fromTo(memRole, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'power1.out' }, 0.68);

      // Scene 2 (3.42-7.82s): past-turn fragments cluster in, teal fork lights one at a time, chosen edge feeds the window.
      var FRAG_START = 3.42;
      fragEls.forEach(function (el, i) {
        tl.fromTo(el,
          { opacity: 0, scale: 0.6, x: -30 },
          { opacity: 1, scale: 1, x: 0, duration: 0.34, ease: 'power2.out' },
          FRAG_START + i * 0.08
        );
      });

      var FORK_START = 3.95;
      forkEdges.forEach(function (p, i) {
        tl.to(p, { strokeDashoffset: 0, opacity: 0.25, duration: 0.34, ease: 'power2.out' }, FORK_START + i * 0.07);
      });

      var CYCLE_START = 4.72;
      var CYCLE_STEP = 0.3;
      fragEls.forEach(function (el, i) {
        var t = CYCLE_START + i * CYCLE_STEP;
        tl.to(el, { borderColor: FRAG_BORDER_LIT, duration: 0.12, ease: 'power1.out' }, t);
        tl.to(el.querySelector('.mem03-frag-tag'), { color: FRAG_TAG_LIT, duration: 0.12 }, t);
        tl.to(forkEdges[i], { opacity: 1, duration: 0.12 }, t);
        if (i > 0) {
          tl.to(fragEls[i - 1], { borderColor: DIM_BORDER, duration: 0.14 }, t);
          tl.to(fragEls[i - 1].querySelector('.mem03-frag-tag'), { color: FRAG_TAG_DIM, duration: 0.14 }, t);
          tl.to(forkEdges[i - 1], { opacity: 0.25, duration: 0.14 }, t);
        }
      });

      var CONT_START = CYCLE_START + (fragEls.length - 1) * CYCLE_STEP + 0.45;
      tl.to(contEdge, { strokeDashoffset: 0, opacity: 1, duration: 0.48, ease: 'power2.out' }, CONT_START);

      var FILL_START = CONT_START + 0.38;
      tl.to(barTeal, { width: '25%', duration: 0.5, ease: 'power1.inOut' }, FILL_START);
      tl.fromTo(layer2, { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.5, ease: 'power2.out' }, FILL_START);

      // Scene 3 (7.82-11.58s): without memory, the chosen path and its content grey out and empty — a stark before/after.
      var GREY_START = 7.82;
      tl.to(contEdge, { stroke: FADED_STROKE, opacity: 0.4, duration: 0.5, ease: 'power1.inOut' }, GREY_START);
      forkEdges.forEach(function (p) {
        tl.to(p, { stroke: FADED_STROKE, opacity: 0.3, duration: 0.5, ease: 'power1.inOut' }, GREY_START);
      });
      fragEls.forEach(function (el) {
        tl.to(el, { borderColor: DIM_BORDER, duration: 0.5, ease: 'power1.inOut' }, GREY_START);
        tl.to(el.querySelector('.mem03-frag-tag'), { color: '#4A525E', duration: 0.5 }, GREY_START);
      });

      var EMPTY_START = 7.98;
      tl.to(layer2, { scaleY: 0, opacity: 0, duration: 0.55, ease: 'power1.inOut' }, EMPTY_START);
      tl.to(barTeal, { width: '0%', duration: 0.55, ease: 'power1.inOut' }, EMPTY_START);
      // holds greyed/stark through the remainder of Scene 3 (until 11.58s) — no further motion.

      // Scene 4 (11.58-14.788s): a mono index counter ticks 1-5 beside the greyed row, landing on a dim "5" badge.
      var COUNTER_IN = 11.58;
      tl.fromTo(counterWrap, { opacity: 0 }, { opacity: 1, duration: 0.32, ease: 'power1.out' }, COUNTER_IN);

      var digits = ['1', '2', '3', '4', '5'];
      var DIGIT_START = 11.95;
      var DIGIT_STEP = 0.3;
      digits.forEach(function (d, i) {
        tl.call(function () { counterBadge.textContent = d; }, null, DIGIT_START + i * DIGIT_STEP);
      });

      var BADGE_LAND = DIGIT_START + (digits.length - 1) * DIGIT_STEP;
      tl.to(counterBadge, { borderColor: 'rgba(137, 146, 161, 0.4)', duration: 0.3, ease: 'power1.out' }, BADGE_LAND + 0.1);

      // Held read with a small deterministic jitter only — no further push.
      var JITTER_START = BADGE_LAND + 0.55;
      tl.to(counterWrap, { x: 2, duration: 0.22, ease: 'sine.inOut' }, JITTER_START);
      tl.to(counterWrap, { x: -2, duration: 0.22, ease: 'sine.inOut' }, JITTER_START + 0.22);
      tl.to(counterWrap, { x: 0, duration: 0.22, ease: 'sine.inOut' }, JITTER_START + 0.44);

      tl.seek(0);
    })();
  </script>
