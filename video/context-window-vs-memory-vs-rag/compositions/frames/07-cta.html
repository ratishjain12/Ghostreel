  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="07-cta"]');
      if (!root) return;

      var commentEl = root.querySelector('#fr07cta-comment');
      var cursorEl = root.querySelector('#fr07cta-cursor');
      var quoteWrap = root.querySelector('#fr07cta-quote-wrap');
      var glowEl = root.querySelector('#fr07cta-glow');
      var sublineEl = root.querySelector('#fr07cta-subline');

      var tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines['07-cta'] = tl;

      // Scene 1 (0.0-1.36s): "Comment" types on, then the cursor waits, blinking.
      var COMMENT = 'Comment';
      var TYPE_START = 0.08;
      var TYPE_DUR = 0.5;
      var commentLen = { v: 0 };
      tl.to(commentLen, {
        v: COMMENT.length,
        duration: TYPE_DUR,
        ease: 'power1.inOut',
        onUpdate: function () {
          commentEl.textContent = COMMENT.substring(0, Math.floor(commentLen.v));
        }
      }, TYPE_START);

      var BLINK_END = 1.36;
      var blink = { p: 0 };
      tl.to(blink, {
        p: Math.PI * 2 * 2.4,
        duration: BLINK_END - TYPE_START,
        ease: 'none',
        onUpdate: function () {
          cursorEl.style.opacity = Math.sin(blink.p) > 0 ? '1' : '0';
        }
      }, TYPE_START);
      tl.set(cursorEl, { opacity: 0 }, BLINK_END);

      // Scene 2 (1.36-3.044s): quoted "guide" spring-pops in beside it with an amber glow bloom.
      var GUIDE_START = 1.36;
      var GUIDE_DUR = 0.5;
      tl.fromTo(quoteWrap,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: GUIDE_DUR, ease: 'power3.out' },
        GUIDE_START
      );
      tl.fromTo(glowEl,
        { opacity: 0, scale: 0.85 },
        { opacity: 0.32, scale: 1, duration: GUIDE_DUR, ease: 'power2.out' },
        GUIDE_START
      );

      // Mono sub-line types on beneath as "and I'll send over the full breakdown" plays.
      var SUBLINE_TEXT = 'FULL BREAKDOWN →';
      var SUB_START = 1.92;
      var SUB_DUR = 0.62;
      var subLen = { v: 0 };
      tl.to(subLen, {
        v: SUBLINE_TEXT.length,
        duration: SUB_DUR,
        ease: 'power1.inOut',
        onUpdate: function () {
          sublineEl.textContent = SUBLINE_TEXT.substring(0, Math.floor(subLen.v));
        }
      }, SUB_START);

      // t ~2.54s-3.044s: the card holds fully still through the trailing silence (final-frame settle).
    })();
