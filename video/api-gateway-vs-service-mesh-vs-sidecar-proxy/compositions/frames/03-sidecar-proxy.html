        <div class="h03-sidecar-proxy-node-label">SERVICE</div>

        <path id="h03-sidecar-proxy-path-out" d="M 578 690 C 600 698, 620 705, 665 700 C 780 690, 1000 760, 1180 780" marker-end="url(#h03-sidecar-proxy-arrow)" />

  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="03-sidecar-proxy"]');
      var scene = root.querySelector('.h03-sidecar-proxy-scene');

      var serviceNode = scene.querySelector('.h03-sidecar-proxy-service');
      var sidecarNode = scene.querySelector('.h03-sidecar-proxy-sidecar');
      var station = scene.querySelector('.h03-sidecar-proxy-station');
      var pathIn = scene.querySelector('#h03-sidecar-proxy-path-in');
      var pathOut = scene.querySelector('#h03-sidecar-proxy-path-out');
      var gate = scene.querySelector('.h03-sidecar-proxy-gate');
      var cycleRow = scene.querySelector('#h03-sidecar-proxy-cycle-row');

      // Measure paths synchronously so dasharray/dashoffset are real geometry, not guesses.
      [pathIn, pathOut].forEach(function (p) {
        var len = p.getTotalLength();
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
      });

      // Build the cycling row: 4 dimmed SERVICE+SIDECAR glyphs, fixed schedule (deterministic).
      var cycleSchedule = [
        { start: 8.00 },
        { start: 8.70 },
        { start: 9.40 },
        { start: 10.10 }
      ];
      var TRAVEL_DUR = 2.2;
      var TRAVEL_X = -1296; // px: from left:100cqw fully off-screen past the left edge

      var minis = cycleSchedule.map(function () {
        var mini = document.createElement('div');
        mini.className = 'h03-sidecar-proxy-mini';

        var svc = document.createElement('div');
        svc.className = 'h03-sidecar-proxy-mini-service';
        mini.appendChild(svc);

        var link = document.createElement('div');
        link.className = 'h03-sidecar-proxy-mini-link';
        mini.appendChild(link);

        var sc = document.createElement('div');
        sc.className = 'h03-sidecar-proxy-mini-sidecar';
        mini.appendChild(sc);

        cycleRow.appendChild(mini);
        return mini;
      });

      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0-1.0s): pinned pair spring-pops in, restrained overshoot.
      tl.fromTo(serviceNode, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(1.5)' }, 0.05);
      tl.fromTo(sidecarNode, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(1.5)' }, 0.18);

      // Scene 2 (1.0-3.48s): station label ticks on, pair border pulses once to pin it.
      tl.fromTo(station, { opacity: 0, x: -6 }, { opacity: 1, x: 0, duration: 0.4, ease: 'power2.out' }, 1.0);
      tl.to([serviceNode, sidecarNode], { borderColor: '#FF9F45', boxShadow: '0 0 14px rgba(255,159,69,0.45)', duration: 0.25, ease: 'power2.out' }, 1.9);
      tl.to([serviceNode, sidecarNode], { borderColor: 'rgba(137,146,161,0.4)', boxShadow: '0 0 0px rgba(255,159,69,0)', duration: 0.3, ease: 'power1.inOut' }, 2.15);

      // Scene 3 (3.48-6.4s): amber edge self-draws, in then out, both routed through SIDECAR.
      tl.to(pathIn, { strokeDashoffset: 0, duration: 0.55, ease: 'power2.out' }, 3.6);
      tl.to(sidecarNode, { borderColor: '#FF9F45', duration: 0.1, ease: 'power2.out' }, 4.0);
      tl.to(sidecarNode, { borderColor: 'rgba(137,146,161,0.4)', duration: 0.15, ease: 'power1.inOut' }, 4.1);
      tl.to(pathOut, { strokeDashoffset: 0, duration: 0.5, ease: 'power2.out' }, 4.6);
      tl.to(sidecarNode, { borderColor: '#FF9F45', duration: 0.1, ease: 'power2.out' }, 4.75);
      tl.to(sidecarNode, { borderColor: 'rgba(137,146,161,0.4)', duration: 0.15, ease: 'power1.inOut' }, 4.85);

      // Scene 4 (6.4-8.0s): the violet gate motif flashes once, small and dim, then fades — a quiet negation.
      tl.fromTo(gate, { opacity: 0 }, { opacity: 0.25, duration: 0.3, ease: 'power1.out' }, 6.4);
      tl.to(gate, { opacity: 0.25, duration: 0.8 }, 6.7);
      tl.to(gate, { opacity: 0, duration: 0.5, ease: 'power1.in' }, 7.5);

      // Scene 5 (8.0-12.79s): 3-4 more identical pairs drift past behind the pin, brightening at center.
      minis.forEach(function (mini, i) {
        var start = cycleSchedule[i].start;
        var mid = start + TRAVEL_DUR / 2;
        tl.to(mini, { x: TRAVEL_X, duration: TRAVEL_DUR, ease: 'none' }, start);
        tl.fromTo(mini, { opacity: 0.35 }, { opacity: 1, duration: TRAVEL_DUR / 2, ease: 'power1.inOut' }, start);
        tl.to(mini, { opacity: 0.35, duration: TRAVEL_DUR / 2, ease: 'power1.inOut' }, mid);
      });
      // Row settles by ~12.3s; the pinned pair — never moved, never dimmed — holds alone to the end.

      window.__timelines = window.__timelines || {};
      window.__timelines['03-sidecar-proxy'] = tl;
    })();
  </script>
