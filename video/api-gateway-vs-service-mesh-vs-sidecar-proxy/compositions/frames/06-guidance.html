  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="06-guidance"]');

      var tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines['06-guidance'] = tl;

      var kicker = root.querySelector('#h06-guidance-kicker');
      var idx1 = root.querySelector('#h06-guidance-idx1');
      var idx2 = root.querySelector('#h06-guidance-idx2');
      var row1 = root.querySelector('#h06-guidance-row1');
      var hlBar1 = root.querySelector('#h06-guidance-hl-bar1');
      var hlBar2 = root.querySelector('#h06-guidance-hl-bar2');
      var stage = root.querySelector('.h06-guidance-stage');
      var words1 = root.querySelectorAll('#h06-guidance-line1 .h06-guidance-word');
      var words2 = root.querySelectorAll('#h06-guidance-line2 .h06-guidance-word');

      // Scene 1 (0.0-4.06s) — kicker + index chip + line 1 per-word stagger reveal.
      tl.fromTo(kicker, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' }, 0);
      tl.fromTo(idx1, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.3, ease: 'back.out(1.6)' }, 0);

      var START1 = 0.1, END1 = 3.5;
      var step1 = words1.length > 1 ? (END1 - START1) / (words1.length - 1) : 0;
      var gatewayOnset = 0;
      words1.forEach(function (el, i) {
        var t = START1 + i * step1;
        if (el.textContent === 'gateway') gatewayOnset = t;
        tl.fromTo(
          el,
          { opacity: 0, y: 14, filter: 'blur(10px)' },
          { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.4, ease: 'power3.out' },
          t
        );
      });
      tl.fromTo(hlBar1, { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: 'power2.out' }, gatewayOnset + 0.45);

      // Scene 2 (4.06-4.76s) — held tension, no motion.

      // Scene 3 (4.76-12.63s) — line 1 dims, line 2 lands, keyword glow pulses.
      var SCENE3_START = 4.76;
      var SCENE3_DUR = 12.63 - 4.76;

      tl.to(row1, { opacity: 0.4, duration: 0.4, ease: 'power2.out' }, SCENE3_START);
      tl.fromTo(
        idx2,
        { opacity: 0, scale: 0.85 },
        { opacity: 1, scale: 1, duration: 0.3, ease: 'back.out(1.6)' },
        SCENE3_START + 0.05
      );

      var START2 = 0.5, END2 = 6.1;
      var step2 = words2.length > 1 ? (END2 - START2) / (words2.length - 1) : 0;
      var meshOnset = 0;
      words2.forEach(function (el, i) {
        var tLocal = START2 + i * step2;
        var t = SCENE3_START + tLocal;
        if (el.textContent === 'mesh') meshOnset = t;
        tl.fromTo(
          el,
          { opacity: 0, y: 14, filter: 'blur(10px)' },
          { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.4, ease: 'power3.out' },
          t
        );
      });
      tl.fromTo(hlBar2, { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: 'power2.out' }, meshOnset + 0.45);

      // Keyword glow (asr-keyword-glow) — retries / mTLS / observability pulse teal in place,
      // scheduled after each word's own entrance tween has fully finished so nothing fights
      // GSAP for control of that element's transform.
      var ATTACK_DUR = 0.15;
      var RELEASE = 0.35;
      var REST_LEVEL = 0.18;
      var MAX_BLUR = 22;
      var MAX_SCALE_BOOST = 0.08;
      var REST_RGB = { r: 237, g: 239, b: 243 };
      var ACTIVE_RGB = { r: 77, g: 232, b: 194 };

      var TIMINGS = {
        retries: { start: 3.04, end: 3.39 },
        mtls: { start: 3.44, end: 3.84 },
        observability: { start: 4.24, end: 4.64 },
      };

      var glowEls = {
        retries: root.querySelector('#h06-guidance-glow-retries'),
        mtls: root.querySelector('#h06-guidance-glow-mtls'),
        observability: root.querySelector('#h06-guidance-glow-observability'),
      };

      function envelope(time, start, end) {
        if (time < start) return 0;
        if (time < end) return Math.min((time - start) / ATTACK_DUR, 1);
        var releaseEnd = end + RELEASE;
        if (time < releaseEnd) return 1 - ((time - end) / RELEASE) * (1 - REST_LEVEL);
        return REST_LEVEL;
      }

      function lerpChannel(a, b, t) {
        return Math.round(a + (b - a) * t);
      }

      var glowDriver = { t: 0 };
      tl.to(
        glowDriver,
        {
          t: SCENE3_DUR,
          duration: SCENE3_DUR,
          ease: 'none',
          onUpdate: function () {
            Object.keys(TIMINGS).forEach(function (key) {
              var el = glowEls[key];
              var timing = TIMINGS[key];
              var env = envelope(glowDriver.t, timing.start, timing.end);
              el.style.textShadow = '0 0 ' + (MAX_BLUR * env) + 'px rgba(77,232,194,' + env + ')';
              el.style.transform = 'scale(' + (1 + MAX_SCALE_BOOST * env) + ')';
              el.style.color =
                'rgb(' +
                lerpChannel(REST_RGB.r, ACTIVE_RGB.r, env) + ',' +
                lerpChannel(REST_RGB.g, ACTIVE_RGB.g, env) + ',' +
                lerpChannel(REST_RGB.b, ACTIVE_RGB.b, env) + ')';
            });
          },
        },
        SCENE3_START
      );

      // Scene 4 (12.63-13.25s) — both lines hold, settle, no exit.
      tl.fromTo(
        stage,
        { scale: 1.006 },
        { scale: 1, duration: 0.3, ease: 'sine.out' },
        12.63
      );
