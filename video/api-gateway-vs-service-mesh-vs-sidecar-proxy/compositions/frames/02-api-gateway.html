  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="02-api-gateway"]');
      var world = root.querySelector('.h02-api-gateway-world');

      var gatewayBox = root.querySelector('#h02-api-gateway-node-gateway');
      var clientBox = root.querySelector('#h02-api-gateway-node-client');
      var serviceBox = root.querySelector('#h02-api-gateway-node-service');

      var edgeLabel = root.querySelector('#h02-api-gateway-label-edge');
      var externalLabel = root.querySelector('#h02-api-gateway-label-external');
      var internalLabel = root.querySelector('#h02-api-gateway-label-internal');

      var authTick = root.querySelector('#h02-api-gateway-tick-auth');
      var rateTick = root.querySelector('#h02-api-gateway-tick-rate');
      var routeTick = root.querySelector('#h02-api-gateway-tick-route');

      var edge1 = root.querySelector('#h02-api-gateway-edge1');
      var edge2 = root.querySelector('#h02-api-gateway-edge2');

      [edge1, edge2].forEach(function (p) {
        var len = p.getTotalLength();
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
        p.dataset.len = len;
      });
      var L1 = parseFloat(edge1.dataset.len);
      var L2 = parseFloat(edge2.dataset.len);

      // Single-source-of-truth virtual camera (viewport-change, single-wrapper composite transform).
      var cam = { scale: 1.4, x: 0, y: 238 };
      function applyCamera() {
        world.style.transform = 'translate(' + cam.x + 'px, ' + cam.y + 'px) scale(' + cam.scale + ')';
      }
      applyCamera(); // seed frame 0 — Stop A: tight on GATEWAY, upper-center.

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines['02-api-gateway'] = tl;

      function tickPopIn(el, t) {
        tl.fromTo(el, { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.15, ease: 'power2.out' }, t);
      }
      function tickFlip(el, t) {
        tl.to(el, { backgroundColor: '#B98CFF', borderColor: '#B98CFF', duration: 0.2, ease: 'power1.out' }, t);
        tl.to(el.querySelector('.h02-api-gateway-tick-label'), { color: '#0A0D12', duration: 0.2, ease: 'power1.out' }, t);
        tl.to(el, { scale: 1.15, duration: 0.1, ease: 'power2.out' }, t);
        tl.to(el, { scale: 1, duration: 0.15, ease: 'power2.out' }, t + 0.1);
      }

      // Scene 1 (0.0-1.57s) — "an API gateway sits at the edge."
      tl.fromTo(gatewayBox, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: 'power3.out' }, 0.0);
      tl.fromTo(edgeLabel, { scale: 0.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: 'power2.out' }, 0.45);

      // Scene 2 (1.57-4.32s) — "the single door external clients come through."
      tl.to(cam, { scale: 1.0, x: 120, y: 40, duration: 2.3, ease: 'power2.inOut', onUpdate: applyCamera }, 1.57);
      tl.fromTo(clientBox, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: 'power3.out' }, 2.0);
      tl.fromTo(externalLabel, { scale: 0.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: 'power2.out' }, 2.6);
      tl.to(edge1, { strokeDashoffset: 0, duration: 0.6, ease: 'power2.out' }, 2.9);

      // Scene 3 (4.32-8.94s) — "it's the one place handling auth, rate limiting, and routing requests to the right service."
      tl.to(cam, { scale: 1.0, x: 0, y: 0, duration: 4.3, ease: 'power2.inOut', onUpdate: applyCamera }, 4.4);

      tl.to(edge2, { strokeDashoffset: L2 * (1 - 0.30), duration: 0.45, ease: 'power2.out' }, 4.6);
      tickPopIn(authTick, 5.05);
      tickFlip(authTick, 5.6); // "auth"

      tl.to(edge2, { strokeDashoffset: L2 * (1 - 0.55), duration: 0.45, ease: 'power2.out' }, 5.75);
      tickPopIn(rateTick, 6.2);
      tickFlip(rateTick, 6.9); // "rate limiting"

      tl.to(edge2, { strokeDashoffset: L2 * (1 - 0.80), duration: 0.45, ease: 'power2.out' }, 7.05);
      tickPopIn(routeTick, 7.5);
      tickFlip(routeTick, 8.0); // "routing"

      tl.to(edge2, { strokeDashoffset: 0, duration: 0.45, ease: 'power2.out' }, 8.15);
      tl.fromTo(serviceBox, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: 'power3.out' }, 8.3);

      // Scene 4 (8.94-12.02s) — "before anything is internal traffic yet." Held read, subtle jitter only.
      tl.fromTo(internalLabel, { opacity: 0 }, { opacity: 0.25, duration: 0.6, ease: 'power1.out' }, 9.1);
      tl.to(cam, { x: 3, y: -2, duration: 0.9, ease: 'sine.inOut', onUpdate: applyCamera }, 9.3);
      tl.to(cam, { x: -2, y: 2, duration: 1.0, ease: 'sine.inOut', onUpdate: applyCamera }, 10.2);
      tl.to(cam, { x: 0, y: 0, duration: 0.8, ease: 'sine.inOut', onUpdate: applyCamera }, 11.2);
    })();
  </script>
