  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="04-service-mesh"]');
      if (!root) return;

      var world = root.querySelector('#h04-service-mesh-world');

      // --- measure + prime every stroke-drawn path (fan lines, mesh lines, tick checkmarks) ---
      var drawPaths = root.querySelectorAll('.h04-service-mesh-draw-path');
      drawPaths.forEach(function (p) {
        var len = p.getTotalLength();
        p.style.strokeDasharray = len;
        p.style.strokeDashoffset = len;
      });

      // --- virtual camera (viewport-change): single wrapper, T = -offset * S ---
      var cam = { scale: 1.8, x: 466.2, y: 725.4 };
      function applyCamera() {
        world.style.transform = 'translate(' + cam.x + 'px, ' + cam.y + 'px) scale(' + cam.scale + ')';
      }
      applyCamera();

      var FAN = {
        A: { p0: { x: 540, y: 461 }, p1: { x: 446, y: 480 }, p2: { x: 353, y: 527 } },
        B: { p0: { x: 540, y: 461 }, p1: { x: 706, y: 480 }, p2: { x: 871, y: 527 } },
        C: { p0: { x: 540, y: 461 }, p1: { x: 580, y: 680 }, p2: { x: 612, y: 911 } },
        D: { p0: { x: 540, y: 461 }, p1: { x: 220, y: 780 }, p2: { x: 353, y: 1295 } },
        E: { p0: { x: 540, y: 461 }, p1: { x: 860, y: 780 }, p2: { x: 871, y: 1295 } }
      };
      function quadPoint(c, t) {
        var mt = 1 - t;
        return {
          x: mt * mt * c.p0.x + 2 * mt * t * c.p1.x + t * t * c.p2.x,
          y: mt * mt * c.p0.y + 2 * mt * t * c.p1.y + t * t * c.p2.y
        };
      }

      var tl = gsap.timeline({ paused: true });

      // ===== Scene 1 (0.0-0.9s): camera pulls back from the single pinned pair, control plane pops in unlit =====
      tl.to(cam, { scale: 1, x: 0, y: 0, duration: 0.9, ease: 'power3.out', onUpdate: applyCamera }, 0);
      tl.fromTo('#h04-service-mesh-control',
        { opacity: 0, scale: 0.86 },
        { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(1.5)', transformOrigin: '50% 50%' },
        0.1);

      // ===== Scene 2 (0.9-3.25s): amber edges fade to ink-dim, left to right =====
      var stubStarts = { a: 0.95, b: 1.30, c: 1.65, d: 2.00, e: 2.35 };
      Object.keys(stubStarts).forEach(function (k) {
        tl.to('#h04-service-mesh-stub-' + k, { opacity: 0.25, duration: 0.4, ease: 'power1.out' }, stubStarts[k]);
      });

      // ===== Scene 3 (3.25-5.45s): control plane lights up, teal fan-lines self-draw to every sidecar at once =====
      tl.to('#h04-service-mesh-control', { borderColor: 'rgba(77,232,194,0.6)', duration: 0.9, ease: 'power1.out' }, 3.25);
      tl.to('#h04-service-mesh-control-title', { color: '#EDEFF3', duration: 0.9, ease: 'power1.out' }, 3.25);
      ['a', 'b', 'c', 'd', 'e'].forEach(function (k, i) {
        tl.to('#h04-service-mesh-fan-' + k, { strokeDashoffset: 0, duration: 1.5, ease: 'power2.out' }, 3.25 + i * 0.03);
      });

      // hollow ticks appear as a pending checklist, just before Scene 4's flips begin
      tl.fromTo('.h04-service-mesh-tick', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, stagger: 0.06, ease: 'power2.out' }, 4.9);

      // ===== Scene 4 (5.45-8.8s): four capability ticks flip in sequence, each pulses teal along every fan-line =====
      function pulseAlong(dotSel, curveKey, startTime) {
        var proxy = { t: 0 };
        var curve = FAN[curveKey];
        tl.set(dotSel, { opacity: 1, attr: { cx: curve.p0.x, cy: curve.p0.y } }, startTime);
        tl.to(proxy, {
          t: 1, duration: 0.5, ease: 'power1.out',
          onUpdate: function () {
            var pt = quadPoint(curve, proxy.t);
            gsap.set(dotSel, { attr: { cx: pt.x, cy: pt.y } });
          }
        }, startTime);
        tl.to(dotSel, { opacity: 0, duration: 0.18, ease: 'power1.in' }, startTime + 0.34);
      }

      function flipTick(idx, time) {
        tl.fromTo('.h04-service-mesh-tick-fill-' + idx,
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.28, ease: 'back.out(2.2)' },
          time);
        tl.to('.h04-service-mesh-tick-check-' + idx, { strokeDashoffset: 0, duration: 0.22, ease: 'power2.out' }, time + 0.15);
        tl.to('.h04-service-mesh-tick-label-' + idx, { color: '#4DE8C2', duration: 0.2, ease: 'power1.out' }, time);
        tl.fromTo('.h04-service-mesh-tick-label-' + idx, { scale: 1 }, { scale: 1.08, duration: 0.12, yoyo: true, repeat: 1, ease: 'power1.inOut', transformOrigin: '50% 50%' }, time);
        ['A', 'B', 'C', 'D', 'E'].forEach(function (k) {
          pulseAlong('#h04-service-mesh-pulse-' + k, k, time);
        });
      }

      flipTick(1, 5.45);
      flipTick(2, 6.29);
      flipTick(3, 7.13);
      flipTick(4, 7.97);

      // ===== Scene 5 (8.8-13.93s): direct sidecar-to-sidecar edges self-draw, mesh fully networks, held read =====
      var meshEdges = [
        { id: 'ab', start: 8.80 },
        { id: 'ac', start: 9.30 },
        { id: 'bc', start: 9.80 },
        { id: 'cd', start: 10.30 },
        { id: 'ce', start: 10.80 },
        { id: 'de', start: 11.30 }
      ];
      meshEdges.forEach(function (e) {
        tl.to('#h04-service-mesh-mesh-' + e.id, { strokeDashoffset: 0, duration: 0.7, ease: 'power2.out' }, e.start);
      });

      tl.to('#h04-service-mesh-kicker', { opacity: 1, duration: 0.6, ease: 'power1.out' }, 12.2);

      // subtle held jitter on the fully networked mesh — finite, seek-safe.
      // Targets the inner content wrapper, never #h04-service-mesh-world (that
      // element's transform is owned exclusively by the manual cam/applyCamera
      // mechanism above — a GSAP x/y/scale tween on it would clobber that string).
      tl.to('#h04-service-mesh-content', { x: '+=3', duration: 0.4, ease: 'sine.inOut', yoyo: true, repeat: 3 }, 12.0);

      window.__timelines = window.__timelines || {};
      window.__timelines['04-service-mesh'] = tl;
      tl.seek(0);
    })();
  </script>
