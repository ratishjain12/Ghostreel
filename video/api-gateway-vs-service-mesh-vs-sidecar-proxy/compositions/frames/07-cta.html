  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="07-cta"]');
      var commentEl = root.querySelector('.cta07-comment');
      var guideEl = root.querySelector('.cta07-guide');
      var glowEl = root.querySelector('.cta07-glow');
      var cardEl = root.querySelector('.cta07-card');
      var subEl = root.querySelector('.cta07-sub');
      var cursorEl = root.querySelector('.cta07-cursor');

      var tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines['07-cta'] = tl;

      // Scene 1 (0.0-0.61s): "Comment" types on — smooth character slice.
      var commentText = 'Comment';
      var commentLen = { v: 0 };
      tl.to(
        commentLen,
        {
          v: commentText.length,
          duration: 0.42,
          ease: 'power1.inOut',
          onUpdate: function () {
            commentEl.textContent = commentText.substring(0, Math.floor(commentLen.v));
          },
        },
        0,
      );

      // Scene 2 (0.61-2.43s): "guide" spring-pops in, glow blooms behind it — land as one beat.
      tl.fromTo(
        guideEl,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: 'power3.out' },
        0.61,
      );
      tl.fromTo(
        glowEl,
        { opacity: 0, scale: 0.85, xPercent: -50, yPercent: -50 },
        { opacity: 0.3, scale: 1, xPercent: -50, yPercent: -50, duration: 0.45, ease: 'power2.out' },
        0.61,
      );

      // Mono sub-line types on beneath, starting once "guide" has landed.
      var subText = 'the full breakdown →';
      var subLen = { v: 0 };
      tl.to(
        subLen,
        {
          v: subText.length,
          duration: 0.9,
          ease: 'power1.inOut',
          onUpdate: function () {
            subEl.textContent = subText.substring(0, Math.floor(subLen.v));
          },
        },
        1.15,
      );

      // Cursor blink — deterministic sin square wave, bounded to the typing window.
      var blink = { p: 0 };
      tl.to(
        blink,
        {
          p: Math.PI * 2 * 1.5,
          duration: 0.9,
          ease: 'none',
          onUpdate: function () {
            cursorEl.style.opacity = Math.sin(blink.p) > 0 ? '1' : '0';
          },
        },
        1.15,
      );
      tl.set(cursorEl, { opacity: 0 }, 2.05);

      // Final frame — the real exit: a slow, gentle settle, then fully still to the last frame.
      tl.fromTo(
        cardEl,
        { scale: 1.018 },
        { scale: 1, duration: 0.38, ease: 'power2.out' },
        2.05,
      );
    })();
