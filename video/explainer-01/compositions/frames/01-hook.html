    (function () {

      const ringProgress = root.querySelector(".f01h-ring-progress");
      const tileOut = root.querySelector(".f01h-tile-out");
      const tileIn = root.querySelector(".f01h-tile-in");
      const counterWrap = root.querySelector(".f01h-counter-wrap");
      const counterNum = root.querySelector(".f01h-counter-num");
      const counterLabel = root.querySelector(".f01h-counter-label");
      const dots = Array.from(root.querySelectorAll(".f01h-dot"));
      const server = root.querySelector(".f01h-server");
      const termCard = root.querySelector(".f01h-term-card");
      const words = Array.from(root.querySelectorAll(".f01h-term-word"));

      const tl = gsap.timeline({ paused: true });

      // Scene 1 (0–1.6s) — the countdown ring drains toward expiry.
      tl.fromTo(ringProgress, { strokeDashoffset: 0 }, { strokeDashoffset: 779, duration: 1.55, ease: "none" }, 0.05);

      // Scene 2 (1.6–4.64s) — on "expires," the tile morphs filled → EXPIRED (scale-swap-transition).
      tl.to(tileOut, { scale: 0.7, opacity: 0, duration: 0.4, ease: "power2.in" }, 1.6);
      tl.fromTo(tileIn, { scale: 0.7 }, { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.6)" }, 1.85);

      // "10,000" counts up while its own scale grows with it (counting-dynamic-scale).
      tl.fromTo(counterLabel, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 2.3);
      const counterState = { value: 0 };
      const START_SCALE = 95 / 190;
      tl.to(
        counterState,
        {
          value: 10000,
          duration: 2.0,
          ease: "power3.out",
          onUpdate: () => {
            counterNum.textContent = Math.round(counterState.value).toLocaleString();
          },
        },
        2.64,
      );
      tl.fromTo(counterNum, { scale: START_SCALE, opacity: 0 }, { scale: 1, opacity: 1, duration: 2.0, ease: "power3.out" }, 2.64);

      // Scene 3 (4.64–6.06s) — request-dots puncture in around the counter, then fling toward the server (spring-pop-entrance, no bounce).
      tl.fromTo(server, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 4.7);
      dots.forEach((dot, i) => {
        const entryAt = 4.64 + i * 0.05;
        const flingX = Number(dot.dataset.flingX);
        const flingY = Number(dot.dataset.flingY);
        tl.fromTo(dot, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, entryAt);
        tl.to(dot, { x: flingX, y: flingY, duration: 0.75, ease: "power3.out" }, entryAt + 0.3);
      });

      // Scene 4 (6.62–8.76s) — counter + dots settle and dim; the coined term assembles word by word (dynamic-content-sequencing).
      tl.to([counterWrap, server, ...dots], { opacity: 0.6, duration: 0.35, ease: "power2.out" }, 6.62);

      const WORD_BASE = 0.22;
      const WORD_SEC_PER_CHAR = 0.02;
      let cursor = 6.8;

        tl.fromTo(word, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, cursor);
        cursor += WORD_BASE + word.textContent.length * WORD_SEC_PER_CHAR;
      });

      window.__timelines["01-hook"] = tl;
