    #root {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      font-family: "Inter", sans-serif;
    }

    .f3-bg {
      position: absolute;
      inset: 0;
      background: #fdfae7;
    }

    /* — request-dot chip cluster (continuity from frame 02) — */
    .f3-cluster {
      position: absolute;
      left: 330px;
      top: 360px;
      width: 420px;
      height: 320px;
    }
    .f3-chip {
      position: absolute;
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: rgba(30, 43, 250, 0.08);
      border: 1.5px solid rgba(30, 43, 250, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .f3-chip span {
      font-family: "Space Grotesk", sans-serif;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.02em;
      color: #1e2bfa;
    }

    /* — DATABASE metric card — */
    .f3-card {
      position: absolute;
      left: 90px;
      top: 680px;
      width: 900px;
      box-sizing: border-box;
      padding: 40px 44px;
      background: rgba(30, 43, 250, 0.04);
      border: 1.5px solid rgba(30, 43, 250, 0.2);
      border-radius: 14px;
    }
    .f3-card-inner {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }
    .f3-row1 {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .f3-eyebrow {
      font-family: "Space Grotesk", sans-serif;
      font-weight: 600;
      font-size: 30px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #1e2bfa;
    }
    .f3-pill {
      font-family: "Space Grotesk", sans-serif;
      font-weight: 500;
      font-size: 20px;
      letter-spacing: 0.02em;
      color: #1e2bfa;
      background: rgba(30, 43, 250, 0.08);
      padding: 8px 22px;
      border-radius: 100px;
    }
    .f3-row2 {
      display: flex;
      align-items: center;
      gap: 32px;
    }
    .f3-bar-col {
      flex: 1.6;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .f3-bar-caption {
      font-family: "Inter", sans-serif;
      font-weight: 400;
      font-size: 17px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgb(110, 110, 110);
    }
    .f3-track-wrap {
      position: relative;
    }
    .f3-track {
      position: relative;
      width: 100%;
      height: 28px;
      background: rgba(30, 43, 250, 0.08);
      border-radius: 6px;
      overflow: hidden;
    }
    .f3-fill {
      width: 100%;
      height: 100%;
      background: #1e2bfa;
      transform: scaleX(0.09);
      transform-origin: left center;
    }
    .f3-edge-dot {
      position: absolute;
      right: -5px;
      top: 50%;
      width: 14px;
      height: 14px;
      border-radius: 50%;

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    const cluster = document.getElementById("f3-cluster");
    const fill = document.getElementById("f3-fill");
    const statCol = document.getElementById("f3-stat-col");
    const counterEl = document.getElementById("f3-counter");
    const edgeDot = document.getElementById("f3-edge-dot");

    /* Scene 2 (2.06-5.02s): the queued dot-stack slams into the card in one beat
       — a long-tail impact settle, not bouncy. */
    const IMPACT_START = 4.3;
    const IMPACT_DUR = 0.55;
    tl.fromTo(
      cluster,
      { y: -16, scale: 1.015 },
      { y: 0, scale: 1, duration: IMPACT_DUR, ease: "power3.out" },
      IMPACT_START,
    );

    /* Scene 3 (5.02-6.54s): load-bar fill rockets calm -> maxed, stepping color
       cobalt -> negative-red at the peg, while "10,000 queries" stamps in beside it
       sharing the same start + ease as the fill (counting-dynamic-scale + stat-bars-and-fills). */
    const BAR_START = 5.02;
    const BAR_DUR = 1.05;
    tl.to(fill, { scaleX: 1, duration: BAR_DUR, ease: "power2.out" }, BAR_START);
    tl.to(
      fill,
      { backgroundColor: "#dc2626", duration: 0.22, ease: "none" },
      BAR_START + BAR_DUR - 0.22,
    );

    tl.fromTo(statCol, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, BAR_START);

    const counterState = { value: 0 };
    const COUNTER_START_SIZE = 38;
    const COUNTER_END_SIZE = 82;
    const COUNTER_START_SCALE = COUNTER_START_SIZE / COUNTER_END_SIZE;
    tl.to(
      counterState,
      {
        value: 10000,
        duration: BAR_DUR,
        ease: "power2.out",
        onUpdate: () => {
          counterEl.textContent = Math.round(counterState.value).toLocaleString("en-US");
        },
      },
      BAR_START,
    );
    tl.fromTo(
      counterEl,
      { scale: COUNTER_START_SCALE },
      { scale: 1, duration: BAR_DUR, ease: "power2.out" },
      BAR_START,
    );

    tl.fromTo(
      ".f3-stat-label",
      { opacity: 0, y: 12 },
      { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
      BAR_START + 0.13,
    );

    /* peg marker pops in right as the fill finishes stepping to red */
    tl.fromTo(edgeDot, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, BAR_START + BAR_DUR - 0.15);

    /* Scene 4 (6.54-8.24s): hold — the pegged red bar sits genuinely still,
       at most a subtle low-amplitude jitter on the bar's edge (sine-wave-loop). */
    const IDLE_START_TIME = 6.7;
    const IDLE_DUR = 8.24 - IDLE_START_TIME;
    const Y_AMP_PX = 2;
    const CYCLES = IDLE_DUR / 1.5;
    const phase = { p: 0 };
    tl.to(
      phase,
      {
        p: Math.PI * 2 * CYCLES,
        duration: IDLE_DUR,
        ease: "none",
        onUpdate: () => {
          const s = Math.sin(phase.p);
          edgeDot.style.transform = `translate(50%, calc(-50% + ${(s * Y_AMP_PX).toFixed(2)}px))`;
        },
      },
      IDLE_START_TIME,
    );

    window.__timelines["03-database-overload"] = tl;
  </script>
