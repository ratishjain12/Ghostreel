  <style>

        2.2cqw 2.2cqw,
        2.2cqw 2.2cqw;

      top: 1578px; /* clear of the caption keep-out line (0.83 * 1920 ≈ 1594) */

    .fx06-kicker-text {

      display: inline-block;

    /* ── gate glyph ── */
    .fx06-gate-wrap {
      position: absolute;
      left: 390px;

    .fx06-gate {
      position: relative;

      position: absolute;

    /* ── ambient glow behind the passed dot ── */
    .fx06-glow {
      position: absolute;

    }
  </style>

  <div data-hf-id="hf-9lby" id="root" data-composition-id="06-the-fix" data-width="1080" data-height="1920" data-duration="4.852">
    <div data-hf-id="hf-dtih" class="fx06-ground clip" data-start="0" data-duration="4.852" data-track-index="0"></div>
    <div data-hf-id="hf-obhp" class="fx06-hairline fx06-hairline--top clip" data-start="0" data-duration="4.852" data-track-index="1"></div>
    <div data-hf-id="hf-t2be" class="fx06-hairline fx06-hairline--bottom clip" data-start="0" data-duration="4.852" data-track-index="2"></div>

    <div data-hf-id="hf-zjkz" class="fx06-kicker-wrap clip" data-start="0" data-duration="4.852" data-track-index="3">
      <span data-hf-id="hf-u9w3" class="fx06-kicker-text" id="fx06-kicker-text"></span><span data-hf-id="hf-r03n" class="fx06-kicker-cursor" id="fx06-kicker-cursor"></span>
    </div>

    <div data-hf-id="hf-4mcy" class="fx06-gate-wrap clip" data-start="0" data-duration="4.852" data-track-index="4">
      <div data-hf-id="hf-q4eu" class="fx06-gate" id="fx06-gate">
        <div data-hf-id="hf-bs70" class="fx06-gate-bar"></div>
        <div data-hf-id="hf-j7iq" class="fx06-gate-fill" id="fx06-gate-fill"></div>
        <div data-hf-id="hf-br3o" class="fx06-gate-bar"></div>
      </div>
    </div>

    <div data-hf-id="hf-7d6v" class="fx06-dot fx06-dot-ghost clip" id="fx06-ghost-1" data-i="1" aria-hidden="true" data-start="0" data-duration="4.852" data-track-index="5"></div>
    <div data-hf-id="hf-q6b0" class="fx06-dot fx06-dot-ghost clip" id="fx06-ghost-2" data-i="2" aria-hidden="true" data-start="0" data-duration="4.852" data-track-index="6"></div>

    <div data-hf-id="hf-1dm6" class="fx06-dot fx06-dot-main clip" id="fx06-dot-main" data-start="0" data-duration="4.852" data-track-index="7"></div>

    <div data-hf-id="hf-qk6h" class="fx06-glow clip" id="fx06-glow" data-start="0" data-duration="4.852" data-track-index="8"></div>

    <div data-hf-id="hf-z7dd" class="fx06-dot fx06-dot-queue clip" id="fx06-queue-0" data-start="0" data-duration="4.852" data-track-index="9"></div>
    <div data-hf-id="hf-gss4" class="fx06-dot fx06-dot-queue clip" id="fx06-queue-1" data-start="0" data-duration="4.852" data-track-index="10"></div>
    <div data-hf-id="hf-v1cm" class="fx06-dot fx06-dot-queue clip" id="fx06-queue-2" data-start="0" data-duration="4.852" data-track-index="11"></div>
    <div data-hf-id="hf-risg" class="fx06-dot fx06-dot-queue clip" id="fx06-queue-3" data-start="0" data-duration="4.852" data-track-index="12"></div>
  </div>

  <script>
    (function () {
      const DURATION = 4.352;
      const tl = gsap.timeline({ paused: true });

      // ── Scene 1 (0.0–0.82s): gate glyph settles in, kicker types on ──
      const GATE_ENTRANCE_START = 0.05;
      const GATE_ENTRANCE_DUR = 0.35;
      tl.fromTo(
        "#fx06-gate",
        { opacity: 0, scaleX: 0.7 },
        { opacity: 1, scaleX: 1, duration: GATE_ENTRANCE_DUR, ease: "power2.out" },
        GATE_ENTRANCE_START,
      );

      // discrete-text-sequence: kicker "THE FIX IS SIMPLE" typed in chunks
      const KICKER_SEQUENCE = [
        { t: 0.0, text: "" },
        { t: 0.12, text: "THE" },
        { t: 0.28, text: "THE FIX" },
        { t: 0.46, text: "THE FIX IS" },
        { t: 0.66, text: "THE FIX IS SIMPLE" },
      ];
      function kickerTextAt(time) {
        for (let i = KICKER_SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= KICKER_SEQUENCE[i].t) return KICKER_SEQUENCE[i].text;
        }
        return "";
      }
      const kickerText = document.getElementById("fx06-kicker-text");
      const kickerDriver = { t: 0 };
      tl.to(
        kickerDriver,
        {
          t: DURATION,
          duration: DURATION,
          ease: "none",
          onUpdate: () => {
            kickerText.textContent = kickerTextAt(kickerDriver.t);
          },
        },
        0,
      );

      // context-sensitive-cursor: deterministic sin blink (single segment/color here)
      const KICKER_BLINK_CYCLES = 6; // whole number over DURATION → period ≈0.73s
      const kickerCursor = document.getElementById("fx06-kicker-cursor");
      const kickerBlink = { p: 0 };
      tl.to(
        kickerBlink,
        {
          p: Math.PI * 2 * KICKER_BLINK_CYCLES,
          duration: DURATION,
          ease: "none",
          onUpdate: () => {
            kickerCursor.style.opacity = Math.sin(kickerBlink.p) > 0 ? "1" : "0";
          },
        },
        0,
      );

      // ── Scene 2 (1.36–2.62s): request-dot streaks up to the gate, gate flashes on contact ──
      const APPROACH_START = 1.36;
      const APPROACH_DUR = 0.4;
      const APPROACH_FROM_Y = 1590; // sits on the content-safe floor, never below keep-out
      const APPROACH_TO_Y = 700; // gate center — the "contact" frame
      const APPROACH_ECHO_STEP = 30;

      tl.fromTo(
        "#fx06-dot-main",
        { y: APPROACH_FROM_Y, opacity: 0 },
        { y: APPROACH_TO_Y, opacity: 1, duration: APPROACH_DUR, ease: "power3.out" },
        APPROACH_START,
      );

      // motion-blur-streak, Path B (echo/ghost trail) — vertical axis
      gsap.utils.toArray(".fx06-dot-ghost").forEach((g) => {
        const i = Number(g.dataset.i);
        tl.fromTo(
          g,
          { y: APPROACH_FROM_Y + i * APPROACH_ECHO_STEP, opacity: 0.45 / i },
          { y: APPROACH_TO_Y, opacity: 0, duration: APPROACH_DUR, ease: "power3.out" },
          APPROACH_START,
        );
      });

      // press-release-spring — gate reacts on contact (no bounce: power2.out release, no back.out)
      const PRESS_START = APPROACH_START + APPROACH_DUR - 0.12; // release lands exactly at contact
      const PRESS_DUR = 0.12;
      const RELEASE_START = PRESS_START + PRESS_DUR;
      const RELEASE_DUR = 0.45;

      tl.to(".fx06-gate-bar", { scaleY: 0.6, duration: PRESS_DUR, ease: "power1.in" }, PRESS_START);
      tl.to(".fx06-gate-bar", { scaleY: 1, duration: RELEASE_DUR, ease: "power2.out" }, RELEASE_START);

      tl.fromTo(
        "#fx06-gate-fill",
        { opacity: 0 },
        { opacity: 1, duration: 0.08, ease: "power1.out" },
        RELEASE_START,
      );
      // settle to a faint residual tint — reads as "now closed" beneath the queued dots
      tl.to(
        "#fx06-gate-fill",
        { opacity: 0.08, duration: 0.35, ease: "power2.out" },
        RELEASE_START + 0.08,
      );

      // ── Scene 3 (2.62–4.352s): passed dot holds above the gate with a glow; others queue and freeze ──
      const CONTINUE_START = 2.62;
      const CONTINUE_DUR = 0.3;
      const HOLD_Y = 560;

      tl.to(
        "#fx06-dot-main",
        { y: HOLD_Y, duration: CONTINUE_DUR, ease: "power2.out" },
        CONTINUE_START,
      );

      // ambient-glow-bloom, bloom-and-hold variant (<3s window — no breathe)
      tl.fromTo(
        "#fx06-glow",
        { opacity: 0, scale: 0.85 },
        { opacity: 0.28, scale: 1, duration: CONTINUE_DUR, ease: "power2.out" },
        CONTINUE_START,
      );

      // queued dots enter from below and freeze mid-approach beneath the closed gate — no bounce
      const QUEUE = [
        { id: "fx06-queue-0", start: 3.0, to: 870 },
        { id: "fx06-queue-1", start: 3.22, to: 1010 },
        { id: "fx06-queue-2", start: 3.44, to: 1150 },
        { id: "fx06-queue-3", start: 3.66, to: 1290 },
      ];
      const QUEUE_MOVE_DUR = 0.3;
      QUEUE.forEach((q) => {
        tl.fromTo(
          `#${q.id}`,
          { y: APPROACH_FROM_Y, opacity: 0 },
          { y: q.to, opacity: 1, duration: QUEUE_MOVE_DUR, ease: "power3.out" },
          q.start,
        );
      });

      window.__timelines = window.__timelines || {};
      window.__timelines["06-the-fix"] = tl;
    })();
  </script>
</template>
