    <div data-hf-id="hf-1cea" class="f04-counter-wrap" id="f04-counter-wrap">

  <svg data-hf-id="hf-p3r6" width="0" height="0" aria-hidden="true" style="position: absolute">
    <defs data-hf-id="hf-0plg" id="f04-filter-defs" />
  </svg>

  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="04-the-stampede"]');
      var dotsWrap = root.querySelector('#f04-dots');
      var defs = root.querySelector('#f04-filter-defs');
      var counterEl = root.querySelector('#f04-counter');
      var counterWrap = root.querySelector('#f04-counter-wrap');
      var dbIcon = root.querySelector('#f04-db');

      var NUM_DOTS = 12;
      var CENTER_X = 540;
      var CENTER_Y = 560;
      var RING_RADIUS = 230;
      var DOT_SIZE = 32;
      var CLUSTER_CX = 540;
      var CLUSTER_CY = 1290;
      var CLUSTER_RADIUS = 46;

      var dots = [];
      for (var i = 0; i < NUM_DOTS; i++) {
        var angleDeg = i * (360 / NUM_DOTS);
        var rad = (angleDeg * Math.PI) / 180;
        var ringX = CENTER_X + RING_RADIUS * Math.cos(rad);
        var ringY = CENTER_Y + RING_RADIUS * Math.sin(rad);
        var clusterX = CLUSTER_CX + CLUSTER_RADIUS * Math.cos(rad);
        var clusterY = CLUSTER_CY + CLUSTER_RADIUS * Math.sin(rad);

        var el = document.createElement('div');
        el.className = 'f04-dot';
        el.style.left = ringX - DOT_SIZE / 2 + 'px';
        el.style.top = ringY - DOT_SIZE / 2 + 'px';
        dotsWrap.appendChild(el);

        // angular distance from 90deg (south, toward the database) — used to
        // order departures so the dots closest to the destination lead the flock
        var diff = Math.abs(((angleDeg - 90 + 540) % 360) - 180);

        dots.push({
          el: el,
          deltaX: clusterX - ringX,
          deltaY: clusterY - ringY,
          leadRank: diff,
        });
      }

      var sortedByLead = dots.slice().sort(function (a, b) {
        return a.leadRank - b.leadRank;
      });
      var LEAD_COUNT = 3;
      var STAGGER = 0.04;
      var MOVE_START = 1.3;
      var MOVE_DUR = 1.0;
      var PEAK_BLUR = 14;

      sortedByLead.forEach(function (d, idx) {
        d.departOrder = idx;
        d.isLead = idx < LEAD_COUNT;
      });

      sortedByLead.slice(0, LEAD_COUNT).forEach(function (d, idx) {
        var filterId = 'f04-streak-' + idx;
        var filter = document.createElementNS('http://www.w3.org/2000/svg', 'filter');
        filter.setAttribute('id', filterId);
        filter.setAttribute('x', '-100%');
        filter.setAttribute('y', '-100%');
        filter.setAttribute('width', '300%');
        filter.setAttribute('height', '300%');
        var blur = document.createElementNS('http://www.w3.org/2000/svg', 'feGaussianBlur');
        blur.setAttribute('id', filterId + '-blur');
        blur.setAttribute('in', 'SourceGraphic');
        blur.setAttribute('stdDeviation', '0 0');
        filter.appendChild(blur);
        defs.appendChild(filter);

        d.el.classList.add('f04-lead');
        d.el.style.filter = 'url(#' + filterId + ')';
        d.blurNode = blur;
      });

      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0-1.3s): the ring "breaking formation" — a quick tension
      // pulse per dot ahead of departure.
      dots.forEach(function (d, i) {
        var at = 0.25 + ((i * 0.07) % 0.75);
        tl.to(d.el, { scale: 1.08, duration: 0.16, ease: 'power1.inOut', yoyo: true, repeat: 1 }, at);
      });

      // Scene 2 (1.3-2.8s): database icon spring-pop entrance — smooth
      // long-tail settle, no bounce.
      tl.fromTo(
        dbIcon,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.6, ease: 'power3.out' },
        MOVE_START,
      );

      // Scene 2 (1.3-2.8s): reverse center-outward-expansion — the ring
      // converges into one dense flock streaming toward the database.
      sortedByLead.forEach(function (d) {
        var at = MOVE_START + d.departOrder * STAGGER;
        tl.fromTo(
          d.el,
          { x: 0, y: 0 },
          { x: d.deltaX, y: d.deltaY, duration: MOVE_DUR, ease: 'power3.out' },
          at,
        );
        if (d.isLead) {
          // The dot is already at rest on screen before "at" (this is a
          // mid-timeline departure, not an off-frame entrance), so the blur
          // is seeded at 0 and jumps to PEAK_BLUR exactly at the departure
          // beat via fromTo, decaying to 0 as the dot settles.
          var blurNode = d.blurNode;
          var blurProxy = { v: 0 };
          tl.fromTo(
            blurProxy,
            { v: PEAK_BLUR },
            {
              v: 0,
              duration: MOVE_DUR,
              ease: 'power3.out',
              onUpdate: function () {
                blurNode.setAttribute('stdDeviation', '0 ' + blurProxy.v);
              },
            },
            at,
          );
        }
      });

      // Scene 3 (2.8-5.12s): the flock has clustered atop the database —
      // "10,000" counts up beside it with escalating scale.
      var COUNT_START = 2.8;
      var COUNT_DUR = 1.4;
      var TARGET_VALUE = 10000;
      var START_SCALE = 0.55;
      var countState = { value: 0 };

      tl.to(
        countState,
        {
          value: TARGET_VALUE,
          duration: COUNT_DUR,
          ease: 'power2.out',
          onUpdate: function () {
            counterEl.textContent = Math.round(countState.value).toLocaleString();
          },
        },
        COUNT_START,
      );
      tl.fromTo(
        counterEl,
        { scale: START_SCALE },
        { scale: 1, duration: COUNT_DUR, ease: 'power2.out' },
        COUNT_START,
      );

      // Post-count hold: subtle bounded jitter, low amplitude, settling
      // before the frame hands off.
      var IDLE_START = COUNT_START + COUNT_DUR + 0.1;
      var TOTAL_DURATION = 5.12;
      var IDLE_DUR = Math.max(0, TOTAL_DURATION - IDLE_START);
      if (IDLE_DUR > 0.1) {
        var phase = { p: 0 };
        var CYCLES = IDLE_DUR / 1.8;
        tl.to(
          phase,
          {
            p: Math.PI * 2 * CYCLES,
            duration: IDLE_DUR,
            ease: 'none',
            onUpdate: function () {
              var s = Math.sin(phase.p);
              counterWrap.style.transform = 'translateY(' + (s * 2) + 'px) scale(' + (1 + s * 0.01) + ')';
            },
          },
          IDLE_START,
        );
      }

      window.__timelines = window.__timelines || {};
      window.__timelines['04-the-stampede'] = tl;
    })();
  </script>
