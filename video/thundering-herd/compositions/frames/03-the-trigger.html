<template>
<style>
    @font-face { font-family: 'Newsreader'; src: url('assets/fonts/newsreader-400.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: block; }
    @font-face { font-family: 'Hanken Grotesk'; src: url('assets/fonts/hanken-grotesk-400.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: block; }
    @font-face { font-family: 'Hanken Grotesk'; src: url('assets/fonts/hanken-grotesk-600.woff2') format('woff2'); font-weight: 600; font-style: normal; font-display: block; }
    @font-face { font-family: 'DM Mono'; src: url('assets/fonts/dm-mono-400.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: block; }
  #root {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    container-type: size;
    font-family: "Hanken Grotesk", sans-serif;
    --t03-ink: #1f2be0;

    --t03-grid: rgba(31, 43, 224, 0.1);
  }
  #root,
  #root * {
    box-sizing: border-box;
  }
  #root > .clip {
    position: absolute;
    inset: 0;
  }

  /* ground: permanent graph-paper grid (cobalt-grid system) */
  .t03-bg {
    background-color: var(--t03-paper);
    background-image:
      linear-gradient(var(--t03-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--t03-grid) 1px, transparent 1px);
    background-size: 21.6px 21.6px; /* ~2cqw cells at 1080 width */
  }

  /* persistent cobalt hairlines, nudged inside the caption/top safe bounds */
  .t03-hairline {
    position: absolute;
    left: 43px;
    right: 43px;
    height: 1.3px;
    background: var(--t03-ink);
  }
  .t03-hairline--top {
    top: 160px;
  }
  .t03-hairline--bottom {
    top: 1580px;
  }

  /* the cache node — foreground subject, HIT (solid) -> MISS (empty) */
  .t03-node {
    position: absolute;

    left: 440px;
    width: 200px;
    height: 200px;
  }
  .t03-node-layer {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 3px solid var(--t03-ink);
  }
  .t03-node-layer--hit {
    background: var(--t03-ink);
    z-index: 2;
    clip-path: inset(0% 0% 0% 0%); /* fully covers the MISS layer beneath */
  }
  .t03-node-layer--miss {

  .t03-node-label {

  /* "CACHE KEY" — supporting Hanken-style uppercase label */

    font-family: "Hanken Grotesk", sans-serif; /* stands in for Hanken Grotesk — no project font files shipped */
    font-weight: 600;

  /* request-dot ring — supporting, shares the node's center as its burst origin */
  .t03-burst-wrap {

<div data-hf-id="hf-e594" id="root" data-composition-id="03-the-trigger" data-width="1080" data-height="1920" data-duration="7.071">
  <div data-hf-id="hf-gsoi" class="clip t03-bg" data-start="0" data-duration="7.071" data-track-index="0"></div>

  <div data-hf-id="hf-9qua" class="clip" data-start="0" data-duration="7.071" data-track-index="1">
    <div data-hf-id="hf-m913" class="t03-hairline t03-hairline--top"></div>
    <div data-hf-id="hf-c67n" class="t03-hairline t03-hairline--bottom"></div>

    <div data-hf-id="hf-k7s3" class="t03-burst-wrap"></div>

    <div data-hf-id="hf-5l9w" class="t03-node">
      <div data-hf-id="hf-k5ka" class="t03-node-layer t03-node-layer--miss">
        <span data-hf-id="hf-ee2j" class="t03-node-label t03-node-label--miss">MISS</span>
      </div>
      <div data-hf-id="hf-isd1" class="t03-node-layer t03-node-layer--hit">
        <span data-hf-id="hf-v24j" class="t03-node-label t03-node-label--hit">HIT</span>
      </div>
    </div>

    <div data-hf-id="hf-wexd" class="t03-key-label">Cache Key</div>
  </div>
</div>

<script>
  (function () {
    const root = document.querySelector('[data-composition-id="03-the-trigger"]');
    const burstWrap = root.querySelector(".t03-burst-wrap");

    // 12 request-dot glyphs on a ring around the node's center; first 6 (angles
    // -90..60) are the "near" group that flips one-by-one on scene 2's words,
    // the remaining 6 (angles 90..240) are the "far" group held for the single
    // scene-3 kinetic-beat-slam.
    const DOT_COUNT = 12;
    const RADIUS = 340;
    const dots = [];
    for (let i = 0; i < DOT_COUNT; i++) {
      const angleRad = ((-90 + i * 30) * Math.PI) / 180;
      const dot = document.createElement("div");
      dot.className = "t03-dot";
      dot.dataset.targetX = Math.round(Math.cos(angleRad) * RADIUS);
      dot.dataset.targetY = Math.round(Math.sin(angleRad) * RADIUS);
      burstWrap.appendChild(dot);
      dots.push(dot);
    }
    const nearDots = dots.slice(0, 6);
    const farDots = dots.slice(6, 12);

    const tl = gsap.timeline({ paused: true });

    // Scene 1 (0.0-1.44s): stage establishes — node settles in, ring bursts
    // outward from the node's center, "Cache Key" label arrives.
    tl.fromTo(
      ".t03-node",
      { opacity: 0, scale: 0.85 },
      { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" },
      0.05,
    );
    tl.fromTo(
      ".t03-key-label",
      { opacity: 0, y: 12 },
      { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
      0.3,
    );

    const ENTRY_AT = 0.25;
    const STAGGER = 0.035;
    const EXPAND_DUR = 0.7;
    dots.forEach((dot, i) => {
      tl.fromTo(
        dot,
        { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 0.6, opacity: 0 },
        {
          x: Number(dot.dataset.targetX),
          y: Number(dot.dataset.targetY),
          scale: 1,
          opacity: 1,
          duration: EXPAND_DUR,
          ease: "power3.out",
        },
        ENTRY_AT + i * STAGGER,
      );
    });

    // Scene 2 (1.44-3.36s): "expires" drains the node's fill (bars/fill wipe)
    // and hard-cuts the label HIT -> MISS; the near ring dots flip hollow one
    // at a time, paced to "every / request / that / needed / that / data".
    tl.to(
      ".t03-node-layer--hit",
      { opacity: 0.7, duration: 0.05, repeat: 3, yoyo: true, ease: "none" },
      1.44,
    );
    tl.fromTo(
      ".t03-node-layer--hit",
      { clipPath: "inset(0% 0% 0% 0%)" },
      { clipPath: "inset(100% 0% 0% 0%)", duration: 0.5, ease: "power2.inOut" },
      1.44,
    );

    function flipDot(el, t) {
      tl.to(el, { scale: 1.3, duration: 0.09, ease: "power1.out" }, t);
      tl.set(el, { backgroundColor: "#f0ebde" }, t + 0.09);
      tl.to(el, { scale: 1, duration: 0.15, ease: "power2.out" }, t + 0.09);
    }

    const NEAR_FLIP_TIMES = [1.94, 2.18, 2.42, 2.65, 2.89, 3.13];
    nearDots.forEach((dot, i) => flipDot(dot, NEAR_FLIP_TIMES[i]));

    // Scene 3 (3.78-6.571s): stillness holds through "suddenly finds it
    // missing" (stillness-before-climax), then the remaining ring flips
    // hollow together in one beat on "all at once", and holds.
    const SLAM_AT = 5.6;
    farDots.forEach((dot) => flipDot(dot, SLAM_AT));

    window.__timelines = window.__timelines || {};
    window.__timelines["03-the-trigger"] = tl;
  })();
</script>
