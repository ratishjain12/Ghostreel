<template>
  <style>
    @font-face { font-family: 'Fraunces'; src: url('assets/fonts/Fraunces-Variable.woff2') format('woff2'); font-weight: 400 700; font-style: normal; font-display: block; }
    @font-face { font-family: 'Fraunces'; src: url('assets/fonts/Fraunces-Italic.woff2') format('woff2'); font-weight: 400 700; font-style: italic; font-display: block; }
    @font-face { font-family: 'IBM Plex Sans'; src: url('assets/fonts/IBMPlexSans-Variable.woff2') format('woff2'); font-weight: 300 700; font-style: normal; font-display: block; }
    @font-face { font-family: 'IBM Plex Mono'; src: url('assets/fonts/IBMPlexMono-400.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: block; }
    @font-face { font-family: 'IBM Plex Mono'; src: url('assets/fonts/IBMPlexMono-500.woff2') format('woff2'); font-weight: 500; font-style: normal; font-display: block; }

    #root {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      container-type: size;
      overflow: hidden;
      --h01-canvas: #0A0D12;
      --h01-ink: #EDEFF3;
      --h01-ink-dim: #8992A1;
      --h01-line: #232B33;
      --h01-accent: #FF9F45;
      --h01-accent-2: #4DE8C2;
      --h01-accent-3: #B98CFF;
    }

    .h01-bg {
      position: absolute;
      inset: 0;
      background-color: var(--h01-canvas);
      background-image:
        repeating-linear-gradient(to right, rgba(35,43,51,0.13) 0 1px, transparent 1px 54px),
        repeating-linear-gradient(to bottom, rgba(35,43,51,0.13) 0 1px, transparent 1px 54px);
    }

    /* ---- Scene 1: term flashes ---- */
    .h01-term-wrap {
      position: absolute;
      top: 30cqh;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.6cqh;
    }

    .h01-term-text {
      font-family: 'Fraunces';
      font-weight: 600;
      font-size: 6.6cqw;
      line-height: 1.0;
      letter-spacing: -0.015em;
      color: var(--h01-accent);
      text-align: center;
    }

    .h01-tick {
      width: 26cqw;
      height: 4px;
      background-color: var(--h01-accent);
      transform-origin: left center;
      transform: scaleX(0);
    }

    /* ---- Scene 2: kicker ---- */
    .h01-kicker-wrap {
      position: absolute;
      top: 46cqh;
      left: 0;
      width: 100%;
      display: flex;
      align-items: baseline;
      justify-content: center;
      opacity: 0;
    }

    .h01-kicker-line {
      font-family: 'IBM Plex Mono';
      font-weight: 500;
      font-size: 2.5cqw;
      letter-spacing: 0.02em;
      color: var(--h01-ink-dim);
      white-space: pre;
    }

    .h01-kicker-cursor {
      display: inline-block;
      width: 0.9cqw;
      height: 2.2cqw;
      background: var(--h01-ink-dim);
      vertical-align: -0.3cqw;
      margin-left: 0.2cqw;
    }

    /* ---- Scene 3: headline ---- */
    .h01-headline-wrap {
      position: absolute;
      top: 32cqh;
      left: 0;
      width: 100%;
      padding: 0 8cqw;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6cqh;
    }

    .h01-headline-line {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.9cqw;
    }

    .h01-word {
      display: inline-block;
      font-family: 'Fraunces';
      font-weight: 600;
      font-size: 6.6cqw;
      line-height: 1.08;
      letter-spacing: -0.015em;
      color: var(--h01-ink);
      transform-origin: 50% 50%;
      opacity: 0;
    }

    .h01-word-glow {
      color: var(--h01-accent-3);
      text-shadow: 0 0 0 rgba(185, 140, 255, 0);
    }
  </style>

  <div id="root" data-composition-id="01-hook" data-width="1080" data-height="1920" data-duration="11.337">
    <div class="h01-bg clip" data-start="0" data-duration="11.337" data-track-index="0"></div>

    <div class="h01-term-wrap clip" data-start="0" data-duration="11.337" data-track-index="1" id="h01-term-wrap">
      <div class="h01-term-text" id="h01-term-text"></div>
      <div class="h01-tick" id="h01-tick"></div>
    </div>

    <div class="h01-kicker-wrap clip" data-start="0" data-duration="11.337" data-track-index="2" id="h01-kicker-wrap">
      <span class="h01-kicker-line" id="h01-kicker-line"></span><span class="h01-kicker-cursor" id="h01-kicker-cursor"></span>
    </div>

    <div class="h01-headline-wrap clip" data-start="0" data-duration="11.337" data-track-index="3" id="h01-headline-wrap">
      <div class="h01-headline-line">
        <span class="h01-word" id="h01-w1">Three</span>
        <span class="h01-word" id="h01-w2">separate</span>
        <span class="h01-word" id="h01-w3">decisions.</span>
      </div>
      <div class="h01-headline-line">
        <span class="h01-word" id="h01-w4">Only</span>
        <span class="h01-word" id="h01-w5">one</span>
        <span class="h01-word" id="h01-w6">is</span>
        <span class="h01-word h01-word-glow" id="h01-w7">automation.</span>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="01-hook"]');
      var tl = gsap.timeline({ paused: true });

      // ---------- Scene 1 (0.0 - 3.2s): hard-cut term flash + signal-color underline tick ----------
      var termTextEl = root.querySelector('#h01-term-text');
      var tickEl = root.querySelector('#h01-tick');
      var termWrapEl = root.querySelector('#h01-term-wrap');

      var TERM_SEQ = [
        { t: 0.00, text: 'Vertical', color: 'var(--h01-accent)' },
        { t: 1.12, text: 'Horizontal', color: 'var(--h01-accent-2)' },
        { t: 2.33, text: 'Auto', color: 'var(--h01-accent-3)' }
      ];

      function entryAt(arr, time) {
        for (var i = arr.length - 1; i >= 0; i--) {
          if (time >= arr[i].t) return arr[i];
        }
        return arr[0];
      }

      var TICK_ATTACK = 0.22;
      var PUNCH_WINDOW = 0.15;
      var PUNCH_AMOUNT = 0.07;

      var termDriver = { t: 0 };
      tl.to(termDriver, {
        t: 3.2,
        duration: 3.2,
        ease: 'none',
        onUpdate: function () {
          var entry = entryAt(TERM_SEQ, termDriver.t);
          if (termTextEl.textContent !== entry.text) {
            termTextEl.textContent = entry.text;
          }
          termTextEl.style.color = entry.color;
          tickEl.style.backgroundColor = entry.color;

          var dt = termDriver.t - entry.t;
          var drawOff = dt < TICK_ATTACK ? (1 - dt / TICK_ATTACK) : 0;
          tickEl.style.transform = 'scaleX(' + (1 - drawOff) + ')';

          var punch = dt < PUNCH_WINDOW ? (1 - dt / PUNCH_WINDOW) * PUNCH_AMOUNT : 0;
          termTextEl.style.transform = 'scale(' + (1 + punch) + ')';
        }
      }, 0);

      // clear scene 1 as scene 2 begins
      tl.fromTo(termWrapEl, { opacity: 1 }, { opacity: 0, duration: 0.22, ease: 'power1.in' }, 3.0);

      // ---------- Scene 2 (3.2 - 5.84s): mono kicker types on with caret ----------
      var kickerWrapEl = root.querySelector('#h01-kicker-wrap');
      var kickerLineEl = root.querySelector('#h01-kicker-line');
      var kickerCursorEl = root.querySelector('#h01-kicker-cursor');
      var KICKER_TEXT = "like it's one decision";
      var TYPE_DUR = 1.3;
      var BLINK_PERIOD = 0.7;
      var KICKER_LOCAL_DUR = 2.15;
      var KICKER_START = 3.3;

      tl.fromTo(kickerWrapEl,
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' },
        KICKER_START
      );

      var kickerDriver = { t: 0 };
      tl.to(kickerDriver, {
        t: KICKER_LOCAL_DUR,
        duration: KICKER_LOCAL_DUR,
        ease: 'none',
        onUpdate: function () {
          if (kickerDriver.t <= TYPE_DUR) {
            var n = Math.min(KICKER_TEXT.length, Math.floor((kickerDriver.t / TYPE_DUR) * KICKER_TEXT.length));
            kickerLineEl.textContent = KICKER_TEXT.slice(0, n);
            kickerCursorEl.style.opacity = 1;
          } else {
            kickerLineEl.textContent = KICKER_TEXT;
            var phase = ((kickerDriver.t - TYPE_DUR) / BLINK_PERIOD) * Math.PI * 2;
            kickerCursorEl.style.opacity = Math.sin(phase) > 0 ? 1 : 0;
          }
        }
      }, KICKER_START);

      tl.to(kickerWrapEl, { opacity: 0, duration: 0.22, ease: 'power1.in' }, 5.55);

      // ---------- Scene 3 (5.84 - 10.837s): headline assembles word by word, "automation." glows ----------
      var headlineWrapEl = root.querySelector('#h01-headline-wrap');

      var WORD_TIMES = {
        'h01-w1': 5.95,
        'h01-w2': 6.30,
        'h01-w3': 6.68,
        'h01-w4': 7.35,
        'h01-w5': 7.62,
        'h01-w6': 7.85
      };

      Object.keys(WORD_TIMES).forEach(function (id) {
        var el = root.querySelector('#' + id);
        tl.fromTo(el,
          { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 0.32, ease: 'power3.out' },
          WORD_TIMES[id]
        );
      });

      // "automation." — opacity-only entrance; the glow driver below owns its `transform`
      // (scale pulse) exclusively so the two never fight over the same CSS property.
      tl.fromTo(root.querySelector('#h01-w7'), { opacity: 0 }, { opacity: 1, duration: 0.28, ease: 'power1.out' }, 8.25);

      // keyword glow envelope on "automation." — attack / sustain / decay to a rest breadcrumb
      var glowWordEl = root.querySelector('#h01-w7');
      var GLOW_START = 8.25;
      var GLOW_ATTACK = 0.22;
      var GLOW_SUSTAIN_END = 8.75;
      var GLOW_RELEASE = 0.5;
      var GLOW_REST = 0.18;
      var GLOW_MAX_BLUR = 22;
      var GLOW_MAX_SCALE = 0.09;
      var GLOW_DUR = 1.6;

      function glowEnvelope(time) {
        if (time < GLOW_START) return 0;
        if (time < GLOW_START + GLOW_ATTACK) return (time - GLOW_START) / GLOW_ATTACK;
        if (time < GLOW_SUSTAIN_END) return 1;
        var releaseEnd = GLOW_SUSTAIN_END + GLOW_RELEASE;
        if (time < releaseEnd) return 1 - ((time - GLOW_SUSTAIN_END) / GLOW_RELEASE) * (1 - GLOW_REST);
        return GLOW_REST;
      }

      var glowDriver = { t: 0 };
      tl.to(glowDriver, {
        t: GLOW_DUR,
        duration: GLOW_DUR,
        ease: 'none',
        onUpdate: function () {
          var localTime = GLOW_START + glowDriver.t;
          var env = glowEnvelope(localTime);
          glowWordEl.style.textShadow = '0 0 ' + (GLOW_MAX_BLUR * env) + 'px rgba(185, 140, 255, ' + (0.25 + env * 0.55) + ')';
          glowWordEl.style.transform = 'scale(' + (1 + GLOW_MAX_SCALE * env) + ')';
        }
      }, GLOW_START);

      // settle-hold with a low-amplitude finite jitter across the last stretch (no repeat/yoyo)
      var IDLE_START = 9.4;
      var IDLE_DUR = 10.837 - IDLE_START;
      var JITTER_CYCLES = 0.6;
      var jitterPhase = { p: 0 };
      tl.to(jitterPhase, {
        p: Math.PI * 2 * JITTER_CYCLES,
        duration: IDLE_DUR,
        ease: 'none',
        onUpdate: function () {
          var s = Math.sin(jitterPhase.p);
          headlineWrapEl.style.transform = 'translateY(' + (s * 2) + 'px) scale(' + (1 + s * 0.008) + ')';
        }
      }, IDLE_START);

      window.__timelines = window.__timelines || {};
      window.__timelines['01-hook'] = tl;
      tl.seek(0);
    })();
  </script>
</template>
