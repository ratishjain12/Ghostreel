<script>
(function () {
  const root = document.querySelector('[data-composition-id="05-split"]');
  const tl = gsap.timeline({ paused: true });

  // --- SVG self-draw setup: measure real geometry, never guess ---
  const drawPaths = [
    '#h05-cap-tick-l', '#h05-cap-bar', '#h05-cap-tick-r',
    '#h05-dec-tick-l', '#h05-dec-bar', '#h05-dec-tick-r'
  ].map((sel) => root.querySelector(sel));
  drawPaths.forEach((p) => {
    const len = p.getTotalLength();
    p.style.strokeDasharray = String(len);
    p.style.strokeDashoffset = String(len);
  });

  const cardAmber = root.querySelector('.h05-card--amber');
  const cardTeal = root.querySelector('.h05-card--teal');
  const cardViolet = root.querySelector('.h05-card--violet');

  // Scene 1 (0.0-1.77s): amber + teal glyphs land — cluster-expansion, converging
  // apart from a shared middle point into their stacked resting slots.
  const CLUSTER_OFFSET = 120;
  tl.fromTo(cardAmber,
    { opacity: 0, y: CLUSTER_OFFSET, scale: 0.72 },
    { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: 'power3.out' }, 0.0);
  tl.fromTo(cardTeal,
    { opacity: 0, y: -CLUSTER_OFFSET, scale: 0.72 },
    { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: 'power3.out' }, 0.2);

  // Scene 2 (1.77-4.07s): "CAPACITY" bracket self-draws beneath the amber+teal pair.
  tl.to('#h05-cap-tick-l', { strokeDashoffset: 0, duration: 0.35, ease: 'power2.out' }, 1.9);
  tl.to('#h05-cap-bar', { strokeDashoffset: 0, duration: 0.5, ease: 'power2.out' }, 2.16);
  tl.to('#h05-cap-tick-r', { strokeDashoffset: 0, duration: 0.3, ease: 'power2.out' }, 2.54);
  tl.fromTo(root.querySelectorAll('.h05-bracket-wrap--capacity .h05-bracket-label'),
    { opacity: 0, y: -6 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power1.out' }, 3.04);

  // Scene 3 (4.07-7.27s): violet glyph lands third, then "DECISION" bracket draws.
  tl.fromTo(cardViolet,
    { opacity: 0, y: 40, scale: 0.85 },
    { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: 'power3.out' }, 4.1);
  tl.to('#h05-dec-tick-l', { strokeDashoffset: 0, duration: 0.3, ease: 'power2.out' }, 4.85);
  tl.to('#h05-dec-bar', { strokeDashoffset: 0, duration: 0.4, ease: 'power2.out' }, 5.075);
  tl.to('#h05-dec-tick-r', { strokeDashoffset: 0, duration: 0.25, ease: 'power2.out' }, 5.375);
  tl.fromTo(root.querySelectorAll('.h05-bracket-wrap--decision .h05-bracket-label'),
    { opacity: 0, y: -6 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power1.out' }, 5.825);

  // Scene 4 (7.27-8.533s): emphasis line lands beside the violet glyph; "fast" glows.
  tl.fromTo(root.querySelector('.h05-emphasis-wrap'),
    { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power2.out' }, 7.3);

  const fastWord = root.querySelector('#h05-word-fast');
  const REST_RGB = { r: 237, g: 239, b: 243 };   // --ink
  const PEAK_RGB = { r: 185, g: 140, b: 255 };   // --violet
  const ATTACK_DUR = 0.15;
  const RELEASE = 0.35;
  const REST_LEVEL = 0.25;
  const MAX_BLUR = 20;
  const MAX_SCALE_BOOST = 0.08;
  const FAST_TIMING = { start: 0.2, end: 0.5 };

  function envelope(t, start, end) {
    if (t < start) return 0;
    if (t < end) return Math.min((t - start) / ATTACK_DUR, 1);
    const releaseEnd = end + RELEASE;
    if (t < releaseEnd) return 1 - ((t - end) / RELEASE) * (1 - REST_LEVEL);
    return REST_LEVEL;
  }
  function lerp(a, b, p) { return Math.round(a + (b - a) * p); }

  const glowDriver = { t: 0 };
  tl.to(glowDriver, {
    t: 1.2,
    duration: 1.2,
    ease: 'none',
    onUpdate: () => {
      const env = envelope(glowDriver.t, FAST_TIMING.start, FAST_TIMING.end);
      const r = lerp(REST_RGB.r, PEAK_RGB.r, env);
      const g = lerp(REST_RGB.g, PEAK_RGB.g, env);
      const b = lerp(REST_RGB.b, PEAK_RGB.b, env);
      fastWord.style.color = `rgb(${r}, ${g}, ${b})`;
      fastWord.style.textShadow = `0 0 ${(MAX_BLUR * env).toFixed(1)}px rgba(185, 140, 255, ${(0.7 * env).toFixed(2)})`;
      fastWord.style.transform = `scale(${(1 + MAX_SCALE_BOOST * env).toFixed(3)})`;
    }
  }, 7.3);

  // Final hold: subtle jitter only (no repeat/yoyo — single phase-driven pass).
  const stackEl = root.querySelector('.h05-stack');
  const jitterPhase = { p: 0 };
  tl.to(jitterPhase, {
    p: Math.PI * 2,
    duration: 0.45,
    ease: 'none',
    onUpdate: () => {
      const s = Math.sin(jitterPhase.p);
      stackEl.style.transform = `translateY(${(s * 1.5).toFixed(2)}px)`;
    }
  }, 8.0);

  window.__timelines = window.__timelines || {};
  window.__timelines['05-split'] = tl;
  tl.seek(0);
