  </style>

  <div id="root" data-composition-id="02-vertical" data-width="1080" data-height="1920" data-duration="14.665">
    <div class="h02-bg clip" data-start="0" data-duration="14.665" data-track-index="0"></div>

    <div class="h02-layer clip" data-start="0" data-duration="14.665" data-track-index="1">
      <div class="h02-kicker" id="h02-kicker">Vertical</div>
      <div class="h02-headline" id="h02-headline">Scale <span class="h02-accent-word">up</span>, not out.</div>

      <div class="h02-node h02-client" id="h02-client">
        <div class="h02-tag">Client</div>
      </div>

      <div class="h02-edge" id="h02-edge">
        <svg viewBox="0 0 40 260" preserveAspectRatio="none">
          <path id="h02-edge-path" d="M 20 0 L 20 260" />
        </svg>
      </div>

      <div class="h02-cap" id="h02-cap">
        <svg viewBox="0 0 700 24" preserveAspectRatio="none">
          <path id="h02-cap-path" d="M 0 12 L 700 12" />
          <path class="h02-cap-tick" id="h02-tick-1" d="M 120 2 L 120 22" />
          <path class="h02-cap-tick" id="h02-tick-2" d="M 300 2 L 300 22" />
          <path class="h02-cap-tick" id="h02-tick-3" d="M 480 2 L 480 22" />
          <path class="h02-cap-tick" id="h02-tick-4" d="M 620 2 L 620 22" />
        </svg>
      </div>

      <div class="h02-node h02-server" id="h02-server">
        <div class="h02-tag" id="h02-server-tag">Server</div>
        <div class="h02-micro-row">
          <div class="h02-micro" id="h02-micro-cpu">CPU</div>
          <div class="h02-micro" id="h02-micro-ram">RAM</div>
        </div>
        <svg class="h02-crack" id="h02-crack" viewBox="0 0 64 64">
          <path d="M 14 8 L 30 28 L 20 34 L 42 56" />
        </svg>
      </div>

      <div class="h02-caption" id="h02-caption">
        <span class="h02-cword" id="h02-cword-1">Same</span><span class="h02-cword" id="h02-cword-2">box</span>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="02-vertical"]');
      var tl = gsap.timeline({ paused: true });

      // measure real geometry for every self-drawing stroke — never guessed
      var edgePath = root.querySelector('#h02-edge-path');
      var edgeLen = edgePath.getTotalLength();
      edgePath.style.strokeDasharray = edgeLen;
      edgePath.style.strokeDashoffset = edgeLen;

      var capPath = root.querySelector('#h02-cap-path');
      var capLen = capPath.getTotalLength();
      capPath.style.strokeDasharray = capLen;
      capPath.style.strokeDashoffset = capLen;

      var capTicks = root.querySelectorAll('.h02-cap-tick');
      capTicks.forEach(function (p) {
        var l = p.getTotalLength();
        p.style.strokeDasharray = l;
        p.style.strokeDashoffset = l;
      });

      var serverEl = root.querySelector('#h02-server');
      var SERVER_GROWTH_SCALE = 2.0;

      // ---- Scene 1 (0.0-1.97s): void canvas + client node + edge draw ----
      tl.fromTo(root.querySelector('#h02-kicker'),
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.35, ease: 'power2.out' },
        0.1
      );
      tl.fromTo(root.querySelector('#h02-headline'),
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' },
        0.28
      );
      tl.fromTo(root.querySelector('#h02-client'),
        { opacity: 0, y: -16 },
        { opacity: 1, y: 0, duration: 0.4, ease: 'power4.out' },
        0.55
      );
      tl.to(edgePath, { strokeDashoffset: 0, duration: 0.55, ease: 'power2.out' }, 0.95);

      // ---- Scene 2 (1.97-4.54s): server node appears + grows, VERTICAL label + CPU/RAM land ----
      tl.fromTo(serverEl,
        { opacity: 0 },
        { opacity: 1, duration: 0.35, ease: 'power2.out' },
        1.97
      );
      tl.to(serverEl, {
        scale: SERVER_GROWTH_SCALE,
        duration: 1.9,
        ease: 'power2.inOut'
      }, 2.35);

      tl.fromTo(root.querySelector('#h02-server-tag'),
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' },
        2.2
      );
      tl.fromTo(root.querySelector('#h02-micro-cpu'),
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' },
        2.65
      );
      tl.fromTo(root.querySelector('#h02-micro-ram'),
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' },
        3.05
      );

      // ---- Scene 3 (4.54-9.98s): hold, "SAME BOX" settles beneath, mostly still ----
      tl.fromTo(root.querySelector('#h02-cword-1'),
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' },
        4.9
      );
      tl.fromTo(root.querySelector('#h02-cword-2'),
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' },
        5.15
      );

      // ---- Scene 4 (9.98-11.68s): hairline ceiling cap draws in, node presses against it ----
      tl.to(capPath, { strokeDashoffset: 0, duration: 0.6, ease: 'power2.out' }, 10.0);
      tl.to(capTicks, { strokeDashoffset: 0, duration: 0.18, ease: 'power2.out', stagger: 0.06 }, 10.42);
      tl.to(serverEl, {
        scale: SERVER_GROWTH_SCALE * 1.03,
        y: -6,
        duration: 0.15,
        ease: 'power2.out'
      }, 10.95);
      tl.to(serverEl, {
        scale: SERVER_GROWTH_SCALE,
        y: 0,
        duration: 0.25,
        ease: 'power2.inOut'
      }, 11.1);

      // ---- Scene 5 (11.68-14.165s): crack/warning tick flashes, holds with subtle jitter ----
      var crackEl = root.querySelector('#h02-crack');
      var CRACK_START = 11.75;
      var ATTACK = 0.18;
      var SUSTAIN_END = 0.55;
      var RELEASE = 0.45;
      var REST_LEVEL = 0.4;
      var crackDriver = { t: 0 };
      tl.to(crackDriver, {
        t: 1.4,
        duration: 1.4,
        ease: 'none',
        onUpdate: function () {
          var t = crackDriver.t;
          var env;
          if (t < 0) { env = 0; }
          else if (t < ATTACK) { env = t / ATTACK; }
          else if (t < SUSTAIN_END) { env = 1; }
          else if (t < SUSTAIN_END + RELEASE) { env = 1 - ((t - SUSTAIN_END) / RELEASE) * (1 - REST_LEVEL); }
          else { env = REST_LEVEL; }
          crackEl.style.opacity = env;
          crackEl.style.filter = 'drop-shadow(0 0 ' + (14 * env) + 'px rgba(255, 92, 122, ' + (0.8 * env) + '))';
          crackEl.style.transform = 'scale(' + (1 + 0.08 * env) + ')';
        }
      }, CRACK_START);

      tl.to(serverEl, {
        borderColor: 'rgba(255, 92, 122, 0.55)',
        duration: 0.35,
        ease: 'power2.out'
      }, 11.9);

      // subtle jitter hold to frame end — bounded, finite, no repeat/yoyo
      var IDLE_START = 12.6;
      var IDLE_DUR = 14.165 - IDLE_START;
      var phase = { p: 0 };
      tl.to(phase, {
        p: Math.PI * 2 * 1,
        duration: IDLE_DUR,
        ease: 'none',
        onUpdate: function () {
          var s = Math.sin(phase.p);
          gsap.set(serverEl, { y: s * 2 });
        }
      }, IDLE_START);

      window.__timelines = window.__timelines || {};
      window.__timelines['02-vertical'] = tl;
      tl.seek(0);
    })();
  </script>
