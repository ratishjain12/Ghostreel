      <div class="h04-loop-wrap" id="h04-loop-wrap">
        <svg class="h04-loop-svg" viewBox="0 0 200 200">
          <defs>

  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="04-auto"]');
      var tl = gsap.timeline({ paused: true });

      var loopArc = root.querySelector('#h04-loop-arc');
      var loopLen = loopArc.getTotalLength();
      loopArc.style.strokeDasharray = loopLen;
      loopArc.style.strokeDashoffset = loopLen;

      var sightLine = root.querySelector('#h04-sight-line');
      var sightLen = sightLine.getTotalLength();
      sightLine.style.strokeDasharray = sightLen;
      sightLine.style.strokeDashoffset = sightLen;

      var eyeDot = root.querySelector('#h04-eye-dot');
      var eyeRing = root.querySelector('#h04-eye-ring');
      var loopWrap = root.querySelector('#h04-loop-wrap');
      var gateTick = root.querySelector('#h04-gate-tick');
      var gateLabel = root.querySelector('#h04-gate-label');
      var sightPulse = root.querySelector('#h04-sight-pulse');

      // ---- Scene 1 (0.0-2.78s): dimmed node stack settles, loop draws in, AUTO label ----
      tl.fromTo(root.querySelectorAll('#h04-node-1, #h04-node-2, #h04-node-3'),
        { opacity: 0, y: 12 }, { opacity: 0.4, y: 0, duration: 0.4, ease: 'power2.out', stagger: 0.06 }, 0);
      tl.fromTo(root.querySelectorAll('#h04-edge-1, #h04-edge-2'),
        { opacity: 0 }, { opacity: 0.4, duration: 0.35, ease: 'power1.out' }, 0.2);

      tl.fromTo(loopWrap, { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.35, ease: 'power2.out', transformOrigin: 'center center' }, 0.15);
      tl.to(loopArc, { strokeDashoffset: 0, duration: 2.0, ease: 'power2.inOut' }, 0.3);

      tl.fromTo(root.querySelector('#h04-kicker'),
        { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power2.out' }, 2.0);

      // ---- Scene 2 (2.78-6.94s): the eye wakes and pulses ("watches real demand"), sightline draws ----
      tl.fromTo([eyeRing, eyeDot], { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'power1.out' }, 2.85);

      var pulsePhase = { p: 0 };
      tl.to(pulsePhase, {
        p: Math.PI * 2 * 3,
        duration: 3.0,
        ease: 'none',
        onUpdate: function () {
          var s = Math.sin(pulsePhase.p);
          var sDot = 1 + s * 0.12;
          var sRing = 1 + Math.sin(pulsePhase.p + Math.PI / 2) * 0.08;
          eyeDot.setAttribute('transform', 'translate(100 100) scale(' + sDot + ') translate(-100 -100)');
          eyeRing.setAttribute('transform', 'translate(100 100) scale(' + sRing + ') translate(-100 -100)');
          eyeRing.style.opacity = String(0.5 + s * 0.3);
        }
      }, 3.1);

      tl.to(sightLine, { strokeDashoffset: 0, duration: 1.2, ease: 'power2.inOut' }, 3.6);

      // ---- Scene 3 (6.94-9.32s): a signal travels down, gate-tick flips, a node lights up ----
      tl.fromTo(sightPulse, { strokeDashoffset: 100, opacity: 0.9 }, { strokeDashoffset: 40, duration: 0.32, ease: 'none' }, 6.85);
      tl.to(sightPulse, { opacity: 0, duration: 0.15, ease: 'power1.out' }, 7.15);

      tl.to(gateTick, {
        backgroundColor: '#B98CFF', borderColor: '#B98CFF',
        duration: 0.3, ease: 'power2.out'
      }, 7.15);
      tl.to(gateTick, { scale: 1.35, duration: 0.14, ease: 'power2.out', transformOrigin: 'center center' }, 7.15);
      tl.to(gateTick, { scale: 1, duration: 0.22, ease: 'power2.inOut', transformOrigin: 'center center' }, 7.29);
      tl.to(gateLabel, { color: '#B98CFF', duration: 0.3, ease: 'power2.out' }, 7.15);

      tl.to(root.querySelector('#h04-node-2'), {
        opacity: 1, borderColor: 'rgba(185,140,255,0.75)', backgroundColor: '#181D24',
        duration: 0.4, ease: 'power2.out'
      }, 7.25);
      tl.to(root.querySelector('#h04-node-2 .h04-node-tag'), { color: '#B98CFF', duration: 0.4, ease: 'power2.out' }, 7.25);
      tl.to(root.querySelector('#h04-node-2'), { scale: 1.06, duration: 0.15, ease: 'power2.out', transformOrigin: 'center center' }, 7.25);
      tl.to(root.querySelector('#h04-node-2'), { scale: 1, duration: 0.22, ease: 'power2.inOut', transformOrigin: 'center center' }, 7.4);

      // ---- Scene 4 (9.32-11.861s): caption settles, holds, subtle jitter on the loop's internals ----
      tl.fromTo(root.querySelector('#h04-cap-1'), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.32, ease: 'power2.out' }, 9.35);
      tl.fromTo(root.querySelector('#h04-cap-2'), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.28, ease: 'power2.out' }, 9.46);
      tl.fromTo(root.querySelector('#h04-cap-3'), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.32, ease: 'power2.out' }, 9.56);
      tl.fromTo(root.querySelector('#h04-caption-underline'),
        { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.3, ease: 'power2.out', transformOrigin: 'center center' }, 9.75);

      var idlePhase = { p: 0 };
      tl.to(idlePhase, {
        p: Math.PI * 2,
        duration: 1.95,
        ease: 'none',
        onUpdate: function () {
          var s = Math.sin(idlePhase.p);
          var sDot = 1 + s * 0.05;
          var sRing = 1 + Math.sin(idlePhase.p + Math.PI / 2) * 0.035;
          eyeDot.setAttribute('transform', 'translate(100 100) scale(' + sDot + ') translate(-100 -100)');
          eyeRing.setAttribute('transform', 'translate(100 100) scale(' + sRing + ') translate(-100 -100)');
        }
      }, 9.9);

      window.__timelines = window.__timelines || {};
      window.__timelines['04-auto'] = tl;
      tl.seek(0);
    })();
  </script>
