    <script>
      (function () {
        "use strict";
        var FRAME_ID = "07-journalctl";
        var DURATION = 5.05;
        var LINE = 57;
        var root = document.querySelector('[data-composition-id="' + FRAME_ID + '"]');
        if (!root) return;
        function q(sel) { return root.querySelector('[data-f07="' + sel + '"]'); }
        function qa(sel) { return Array.prototype.slice.call(root.querySelectorAll('[data-f07="' + sel + '"]')); }

        var term = q("term");
        var cmd = q("cmd");
        var caret = q("caret");
        var tag = q("tag");
        var list = q("list");
        var band = q("band");
        var preRows = qa("pre");
        var errRow = q("err");
        var marker = q("marker");
        var postRows = qa("post");
        var wordGroups = qa("wg");

        // Typed-prompt law: chars-at-time table built once, synchronously, seeded cadence.
        var COMMAND = "journalctl";
        var TYPE_START = 1.03;
        var lcg = 0x0707a11c;
        function rnd() {
          lcg = (Math.imul(1664525, lcg) + 1013904223) >>> 0;
          return lcg / 4294967296;
        }
        var rows = [{ t: 0, n: 0 }];
        (function () {
          var t = TYPE_START;
          var n = 0;
          while (n < COMMAND.length) {
            var take = Math.min(COMMAND.length - n, 1 + Math.floor(rnd() * 3));
            n += take;
            rows.push({ t: t, n: n });
            t += take * (0.035 + rnd() * 0.025);
          }
        })();
        var TYPE_END = rows[rows.length - 1].t;
        var EXEC_AT = 1.9;
        function charsAt(time) {
          for (var i = rows.length - 1; i >= 0; i -= 1) {
            if (time >= rows[i].t - 0.001) return rows[i].n;
          }
          return 0;
        }
        function caretOn(time) {
          if (time >= EXEC_AT) return false;
          if (time >= TYPE_START - 0.001 && time <= TYPE_END + 0.15) return true;
          return Math.floor(time / 0.5) % 2 === 0;
        }
        function render(time) {
          cmd.textContent = COMMAND.slice(0, charsAt(time));
          caret.style.opacity = caretOn(time) ? "1" : "0";
        }
        render(0);

        var tl = gsap.timeline({ paused: true });

        // Scene 1: chrome seated; terminal settles.
        tl.fromTo(term, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0);

        // Scene 1-5 driver: typing + caret as a pure function of time.
        var clock = { t: 0 };
        tl.fromTo(clock, { t: 0 }, {
          t: DURATION,
          duration: DURATION,
          ease: "none",
          onUpdate: function () { render(clock.t); }
        }, 0);

        // Scene 2: "or your app logs" tag.
        tl.fromTo(tag, { opacity: 0, x: 12 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 1.65);

        // Scene 3: log rows print.
        var preTimes = [1.95, 2.12, 2.29, 2.46, 2.63, 2.8, 2.97];
        preRows.forEach(function (row, i) {
          tl.fromTo(row, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, preTimes[i]);
        });

        // Scene 4: ERROR prints, band locks, list scrolls up, trailing rows dim.
        tl.fromTo(errRow, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, 3.25);
        tl.fromTo(band, { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, 3.3);
        tl.fromTo(list, { y: 0 }, { y: -LINE, duration: 0.16, ease: "power3.out" }, 3.25);

        var postTimes = [3.45, 3.65];
        postRows.forEach(function (row, i) {
          tl.fromTo(row, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, postTimes[i]);
          tl.fromTo(list, { y: -LINE * (i + 1) }, { y: -LINE * (i + 2), duration: 0.16, ease: "power3.out", immediateRender: false }, postTimes[i]);
        });
        tl.fromTo(postRows, { opacity: 1 }, { opacity: 0.28, duration: 0.3, ease: "power3.out", immediateRender: false }, 3.95);

        // Scene 5: open a slot under ERROR, pin the marker, land the takeaway.
        tl.fromTo(list, { y: -LINE * 3 }, { y: -LINE * 4, duration: 0.3, ease: "power3.out", immediateRender: false }, 4.35);
        tl.fromTo(postRows, { y: 0 }, { y: LINE, duration: 0.3, ease: "power3.out" }, 4.35);
        tl.fromTo(marker, { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 4.5);

        tl.fromTo(wordGroups[0], { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 4.38);
        tl.fromTo(wordGroups[1], { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 4.6);

        tl.seek(0);
        window.__timelines = window.__timelines || {};
        window.__timelines[FRAME_ID] = tl;
      })();
