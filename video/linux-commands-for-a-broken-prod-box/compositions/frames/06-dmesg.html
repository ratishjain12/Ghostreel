        var COMMAND = "dmesg";
        var TYPE_START = 0.72;
        var EXEC_AT = 1.3;
        var TAIL_AT = 4.1;

        // Typed-prompt law: chars-at-time table built once, seeded per frame.
        var lcg = 0x06d3e59;
        function rnd() {
          lcg = (Math.imul(1664525, lcg) + 1013904223) >>> 0;
          return lcg / 4294967296;
        }
        var rows = [{ t: 0, n: 0 }];
        (function () {
          var t = TYPE_START;
          var n = 0;
          while (n < COMMAND.length) {
            var k = Math.min(COMMAND.length - n, 1 + Math.floor(rnd() * 2));
            n += k;
            rows.push({ t: t, n: n });
            t += k * (0.05 + rnd() * 0.03);
          }
        })();
        var TYPE_END = rows[rows.length - 1].t;
        function charsAt(time) {
          for (var i = rows.length - 1; i >= 0; i -= 1) {
            if (time >= rows[i].t - 0.001) return rows[i].n;
          }
          return 0;
        }
        function blinkOn(time) {
          return Math.floor(time / 0.5) % 2 === 0;
        }
        function render(time) {
          cmd.textContent = COMMAND.slice(0, charsAt(time));
          var cmdCaret;
          if (time >= EXEC_AT) cmdCaret = false;
          else if (time >= TYPE_START - 0.001 && time <= TYPE_END + 0.2) cmdCaret = true;
          else cmdCaret = blinkOn(time);
          caretCmd.style.opacity = cmdCaret ? "1" : "0";
          caretTail.style.opacity = time >= TAIL_AT && blinkOn(time - TAIL_AT) ? "1" : "0";
