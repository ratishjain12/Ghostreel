    <script>
      (function () {
        "use strict";
        var FRAME = "03-top";
        var DUR = 5.75;
        var root = document.querySelector('[data-composition-id="' + FRAME + '"]');
        if (!root) return;
        var q = function (s) { return root.querySelector(s); };
        var qa = function (s) { return Array.prototype.slice.call(root.querySelectorAll(s)); };

        var term = q(".f03-term");
        var chipFill = q(".f03-chip-fill");
        var cmd = q(".f03-cmd");
        var caret = q(".f03-caret");
        var alt = q(".f03-alt");
        var head = q(".f03-head");
        var hCpu = q(".f03-h-cpu");
        var hMem = q(".f03-h-mem");
        var rows = qa(".f03-row");
        var guilty = q(".f03-guilty");
        var gCpu = q(".f03-g-cpu");
        var gMem = q(".f03-g-mem");
        var take1 = q(".f03-take-1");
        var take2 = q(".f03-take-2");

        // Typed-prompt law: chars-at-time table built once, seeded human cadence.
        var FULL = "top";
        var lcg = 0x03f0a1b3;
        function rnd() { lcg = (Math.imul(1664525, lcg) + 1013904223) >>> 0; return lcg / 4294967296; }
        var TYPE_START = 1.12;
        var typeRows = [{ t: 0, n: 0 }];
        var tt = TYPE_START;
        for (var i = 1; i <= FULL.length; i += 1) {
          tt += 0.05 + rnd() * 0.04;
          typeRows.push({ t: tt, n: i });
        }
        var TYPE_END = tt;
        var EXEC = 2.55;
        function charsAt(t) {
          for (var k = typeRows.length - 1; k >= 0; k -= 1) {
            if (t >= typeRows[k].t - 0.001) return typeRows[k].n;
          }
          return 0;
        }
        function caretOn(t) {
          if (t >= EXEC) return false;
          if (t >= TYPE_START && t <= TYPE_END + 0.25) return true;
          return Math.floor(t / 0.5) % 2 === 0;
        }
        cmd.textContent = "";

        var tl = gsap.timeline({ paused: true });

        // Scene 1: chrome seated, coral chip draws on, terminal settles.
        tl.fromTo(chipFill, { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 0.1);
        tl.fromTo(term, { y: 14 }, { y: 0, duration: 0.3, ease: "power3.out" }, 0);

        // Typing + caret, both pure functions of the driver time.
        var drive = { t: 0 };
        tl.to(drive, {
          t: DUR, duration: DUR, ease: "none",
          onUpdate: function () {
            cmd.textContent = FULL.slice(0, charsAt(drive.t));
            caret.style.opacity = caretOn(drive.t) ? "1" : "0";
          }
        }, 0);

        // Scene 2: "or htop" tag.
        tl.fromTo(alt, { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 1.61);

        // Scene 3: header then five rows print quickly, bars draw left to right.
        tl.fromTo(head, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, 2.61);
        rows.forEach(function (row, idx) {
          var at = 2.74 + idx * 0.13;
          tl.fromTo(row, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, at);
          var meters = Array.prototype.slice.call(row.querySelectorAll(".f03-meter"));
          tl.fromTo(meters, { scaleX: 0 }, { scaleX: 1, duration: 0.32, ease: "power3.out", stagger: 0.04 }, at);
        });

        // Scene 4: the guilty row rises to the top slot (lift out, others push down, land on top).
        var STEP = 57;
        var others = rows.filter(function (r) { return r !== guilty && Number(r.getAttribute("data-slot")) < 3; });
        tl.fromTo(guilty, { opacity: 1, y: 0 }, { opacity: 0, y: -6, duration: 0.14, ease: "power2.in", immediateRender: false }, 3.57);
        tl.fromTo(others, { y: 0 }, { y: STEP, duration: 0.3, ease: "power3.out", immediateRender: false }, 3.62);
        tl.set(guilty, { y: -3 * STEP + 8 }, 3.9);
        tl.fromTo(guilty, { opacity: 0, y: -3 * STEP + 8 }, { opacity: 1, y: -3 * STEP, duration: 0.32, ease: "power3.out", immediateRender: false }, 3.9);
        tl.fromTo(guilty, { borderColor: "rgba(198,69,69,0)" }, { borderColor: "rgba(198,69,69,1)", duration: 0.25, ease: "power2.out", immediateRender: false }, 3.92);

        tl.fromTo(hCpu, { color: "rgba(250,249,245,0.55)" }, { color: "#5DB8A6", duration: 0.25, ease: "power2.out", immediateRender: false }, 3.97);
        tl.fromTo(gCpu, { backgroundColor: "rgba(250,249,245,0.18)" }, { backgroundColor: "#5DB8A6", duration: 0.3, ease: "power2.out", immediateRender: false }, 3.97);
        tl.fromTo(hMem, { color: "rgba(250,249,245,0.55)" }, { color: "#5DB8A6", duration: 0.25, ease: "power2.out", immediateRender: false }, 4.63);
        tl.fromTo(gMem, { backgroundColor: "rgba(250,249,245,0.18)" }, { backgroundColor: "#5DB8A6", duration: 0.3, ease: "power2.out", immediateRender: false }, 4.63);

        // Scene 5: takeaway in two word groups, then hold.

        tl.seek(0);
        window.__timelines = window.__timelines || {};
        window.__timelines[FRAME] = tl;
